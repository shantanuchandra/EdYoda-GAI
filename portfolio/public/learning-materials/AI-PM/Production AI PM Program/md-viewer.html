gic signal;\n2. weakest assumption;\n3. missing evidence;\n4. one scope cut;\n5. one sharper version of the strategy.\n```\n\n---\n\n## Week 3: AI PRD Behavior Prompt\n\n```text\nAct as a PM writing an AI PRD for engineering.\n\nProduct concept:\n[concept]\n\nUser workflow:\n[workflow]\n\nDraft the system behavior section with:\n- inputs;\n- required context;\n- retrieval sources;\n- tools/actions;\n- output format;\n- human approval points;\n- refusal behavior;\n- escalation behavior;\n- logging requirements.\n\nThen list the top 8 failure modes with:\n- user impact;\n- detection method;\n- mitigation.\n```\n\n---\n\n## Week 4: Agent Workflow Prompt\n\n```text\nAct as an agentic workflow designer.\n\nWorkflow:\n[workflow]\n\nUser:\n[user]\n\nGoal:\n[goal]\n\nDesign a workflow with:\n- 4 to 7 steps;\n- AI role in each step;\n- human role in each step;\n- data or tool used;\n- approval requirement;\n- stop condition;\n- recovery path if the step fails.\n\nUse autonomy tiers from 0 to 4. Recommend the safest starting tier for launch.\n```\n\n---\n\n## Week 5: Eval Dataset Generator Prompt\n\n```text\nAct as an AI eval designer.\n\nProduct:\n[product]\n\nWorkflow:\n[workflow]\n\nKnown risks:\n[risks]\n\nGenerate 20 golden dataset rows with:\n- ID;\n- input;\n- context;\n- expected behavior;\n- failure category;\n- severity;\n- whether failure should block launch.\n\nInclude normal cases, edge cases, adversarial cases, missing-context cases, and unsafe-action cases.\n```\n\n---\n\n## Week 6: Engineering Review Prep Prompt\n\n```text\nAct as an AI/ML engineering lead reviewing a PM architecture brief.\n\nHere is my system map:\n[system map]\n\nHere is my AI PRD summary:\n[summary]\n\nIdentify:\n- unclear technical assumptions;\n- missing data or context requirements;\n- retrieval risks;\n- tool/action risks;\n- eval gaps;\n- observability gaps;\n- cost and latency questions.\n\nReturn the 10 most important engineering review questions I should be ready to answer.\n```\n\n---\n\n## Week 7: Launch Readiness Prompt\n\n```text\nAct as a production readiness reviewer for an AI product.\n\nProduct:\n[product]\n\nWorkflow:\n[workflow]\n\nArchitecture:\n[architecture]\n\nEval plan:\n[eval plan]\n\nReview for:\n- quality risks;\n- prompt injection;\n- data leakage;\n- excessive agency;\n- high-cost loops;\n- latency;\n- monitoring;\n- rollback;\n- human escalation.\n\nReturn:\n1. risk register;\n2. launch-blocking issues;\n3. beta criteria;\n4. GA criteria;\n5. rollback triggers.\n```\n\n---\n\n## Week 8: Interview Story Prompt\n\n```text\nAct as a senior AI PM interviewer.\n\nHere is my capstone:\n[summary]\n\nHelp me turn it into a 2-minute interview story using:\n1. Situation\n2. Product judgment\n3. Technical tradeoff\n4. Eval and quality bar\n5. Launch risk\n6. Cross-functional leadership\n7. Result or expected result\n\nThen ask me 8 hard follow-up questions a senior interviewer might ask.\n```\n\n---\n\n## Critique Prompt For Peer Review\n\n```text\nAct as a direct but constructive peer reviewer.\n\nArtifact:\n[paste artifact]\n\nReview it using this frame:\n- What is the strongest decision?\n- What is the weakest assumption?\n- What would fail in production?\n- What is too generic?\n- What should be cut?\n- What evidence is missing?\n- What is the next best improvement?\n\nKeep the critique specific and senior-level.\n```\n\n---\n\n## Workflow Pattern 1: Human-Approved Copilot\n\n```text\nUser requests help\n  -> AI gathers context\n  -> AI drafts recommendation\n  -> human reviews\n  -> human edits or approves\n  -> approved action is logged\n  -> outcome feeds evals\n```\n\nUse when:\n\n- quality matters;\n- user trust matters;\n- action risk is moderate;\n- human judgment should stay in the loop.\n\n---\n\n## Workflow Pattern 2: RAG Answer With Citations\n\n```text\nUser asks question\n  -> retrieve approved sources\n  -> rank and filter context\n  -> generate answer with citations\n  -> refuse if evidence is insufficient\n  -> log query, sources, answer, and feedback\n```\n\nUse when:\n\n- answers need grounding;\n- source trust matters;\n- users need evidence;\n- stale or wrong answers are risky.\n\n---\n\n## Workflow Pattern 3: Agentic Triage\n\n```text\nNew item arrives\n  -> AI classifies urgency and category\n  -> AI retrieves relevant context\n  -> AI recommends next step\n  -> low-risk items route automatically\n  -> high-risk items escalate\n  -> outcomes update the eval dataset\n```\n\nUse when:\n\n- many items need routing;\n- categories are clear;\n- mistakes can be detected;\n- escalation paths exist.\n\n---\n\n## Workflow Pattern 4: Decision Support Assistant\n\n```text\nUser describes goal\n  -> AI gathers preferences and constraints\n  -> AI ranks options\n  -> AI explains tradeoffs\n  -> user selects or asks follow-up\n  -> system logs decision and feedback\n```\n\nUse when:\n\n- the product helps users choose;\n- explainability matters;\n- the right answer depends on preferences;\n- trust is built through tradeoff clarity.\n\n---\n\n## Prompt Quality Checklist\n\n- [ ] The prompt names the user and workflow.\n- [ ] The prompt includes constraints and context.\n- [ ] The prompt asks for assumptions.\n- [ ] The prompt asks for failure modes.\n- [ ] The output format is structured.\n- [ ] The prompt includes refusal or escalation behavior when relevant.\n- [ ] The prompt does not include private data.\n- [ ] The output is reviewed against the product artifact, not accepted blindly.\n"},{"file":"00_Onboarding_Communications_And_Email_Templates.md","title":"Onboarding, Communications, And Email Templates","body":"# Onboarding, Communications, And Email Templates\n\n## Purpose\n\nUse these templates to run a polished cohort without writing every message from scratch.\n\nReplace bracketed fields before sending.\n\n---\n\n## Communication Cadence\n\n| Timing | Message |\n|---|---|\n| After enrollment | Welcome and expectations |\n| 7 days before Week 1 | Setup checklist |\n| 24 hours before each session | Session reminder |\n| Within 24 hours after each session | Recording, workbook, assignment |\n| Midweek | Submission nudge |\n| Before feedback checkpoints | Artifact reminder |\n| Week 8 | Final portfolio instructions |\n| After cohort | Completion, next steps, testimonial request |\n\n---\n\n## Enrollment Welcome\n\nSubject: Welcome to Production AI PM\n\n```text\nHi [Name],\n\nWelcome to Production AI PM.\n\nOver 8 weeks, you will build a Senior AI PM Portfolio Packet that shows how you would lead a GenAI or agentic product from strategy to launch.\n\nBefore Week 1, please:\n1. read the learner handbook;\n2. set up the core tools;\n3. choose one AI product idea from your work or domain;\n4. create a private folder for your portfolio artifacts.\n\nThis cohort assumes you already understand PM fundamentals. We will focus on AI-specific product judgment, system design, evals, production readiness, and executive communication.\n\nSee you in Week 1.\n```\n\n---\n\n## Setup Reminder\n\nSubject: Production AI PM setup checklist\n\n```text\nHi [Name],\n\nPlease complete these before our first live session:\n\n- Claude or ChatGPT access\n- Research tool access\n- Google Docs, Notion, or equivalent\n- Google Sheets, Airtable, or equivalent\n- n8n, Make, Zapier, or equivalent\n- Private folder for your portfolio packet\n- One AI product idea to evaluate\n\nIf you cannot use a real work problem, use the shared Customer Success Copilot case or one of the fallback capstones in the casebook.\n\nBring one idea you are willing to critique honestly. The goal in Week 1 is not to defend the idea. It is to test whether it deserves to exist.\n```\n\n---\n\n## 24-Hour Session Reminder\n\nSubject: Tomorrow: Session [Number] - [Session Title]\n\n```text\nHi [Name],\n\nTomorrow's session is [Session Title].\n\nPlease have open:\n- the learner workbook;\n- your current portfolio artifact;\n- your notes from the last session;\n- any sample inputs, outputs, or eval rows requested in the take-home.\n\nThe artifact for this session is:\n[Artifact]\n\nBring one decision you want critiqued.\n```\n\n---\n\n## Post-Session Follow-Up\n\nSubject: Session [Number] recap and assignment\n\n```text\nHi everyone,\n\nThanks for the work in Session [Number].\n\nLinks:\n- Recording: [link]\n- Workbook: [link]\n- Portfolio packet: [link]\n- Relevant companion doc: [link]\n\nYour take-home:\n[assignment]\n\nQuality bar:\n[quality bar]\n\nPlease submit by [deadline] so we can use your work in critique and feedback.\n```\n\n---\n\n## Midweek Submission Nudge\n\nSubject: Quick nudge: [Artifact] due [Date]\n\n```text\nHi [Name],\n\nQuick nudge that your [Artifact] is due [Date].\n\nDo not over-polish it. Submit a clear draft with:\n- the decision it supports;\n- the weakest assumption;\n- the main production risk;\n- one question you want feedback on.\n\nRough but specific is better than polished and generic.\n```\n\n---\n\n## Feedback Checkpoint Reminder\n\nSubject: Feedback checkpoint: [Artifact]\n\n```text\nHi [Name],\n\nThis week is a feedback checkpoint for [Artifact].\n\nBefore submitting, check:\n- Is the user and workflow specific?\n- Is the AI role justified?\n- Are failure modes visible?\n- Is the quality bar measurable?\n- Is the next decision clear?\n\nPlease submit by [deadline].\n```\n\n---\n\n## Falling Behind Message\n\nSubject: Getting you back on track\n\n```text\nHi [Name],\n\nI noticed a couple of artifacts are still pending.\n\nThe fastest path back:\n1. submit the current artifact first;\n2. do not rewrite older work yet;\n3. use the portfolio packet template;\n4. add only the minimum detail needed for critique.\n\nIf you are blocked, reply with the artifact name and the specific decision you are stuck on.\n```\n\n---\n\n## Final Portfolio Instructions\n\nSubject: Final portfolio packet instructions\n\n```text\nHi everyone,\n\nFor the final session, please assemble your Senior AI PM Portfolio Packet.\n\nIt should include:\n1. AI Product Strategy Memo\n2. AI PRD\n3. Agent/RAG Workflow Prototype\n4. Eval Dataset and Rubric\n5. Technical Architecture Brief\n6. Production Readiness Review\n7. Executive Narrative and Interview Story\n\nLabel each artifact:\n- public;\n- private;\n- anonymized;\n- interview-only.\n\nPrepare a 2-minute executive story. Focus on judgment, tradeoffs, evals, and launch readiness.\n```\n\n---\n\n## Completion Message\n\nSubject: Production AI PM completion and next steps\n\n```text\nHi [Name],\n\nCongratulations on completing Production AI PM.\n\nYour next step is to polish the portfolio packet for the context you care about most:\n- internal promotion;\n- AI PM interviews;\n- public portfolio;\n- consulting or advisory credibility;\n- stronger AI product leadership in your current role.\n\nRecommended 7-day polish:\nDay 1: tighten the strategy memo\nDay 2: clean the AI PRD\nDay 3: strengthen eval rows\nDay 4: sharpen the architecture brief\nDay 5: simplify the launch review\nDay 6: rehearse the 2-minute story\nDay 7: decide what is public, private, or interview-only\n\nYour portfolio should show one thing clearly: you can lead AI products beyond the demo.\n```\n\n---\n\n## Testimonial Request\n\nSubject: Quick feedback on Production AI PM\n\n```text\nHi [Name],\n\nIf the cohort was useful, I would appreciate a short testimonial.\n\nPrompt:\n\"Before Production AI PM, I struggled with ____. After the cohort, I can now ____. The most valuable part was ____.\"\n\nPlease avoid sharing confidential company details.\n\nThank you for being part of the cohort.\n```\n\n---\n\n## Community Guidelines Message\n\nSubject: Cohort norms\n\n```text\nHi everyone,\n\nA few norms for the cohort:\n\n- critique artifacts, not people;\n- protect confidential information;\n- do not share another learner's work outside the cohort;\n- bring specific decisions, not vague questions;\n- use AI tools, but do not outsource judgment;\n- give feedback that makes the work sharper.\n\nThe cohort works best when the room is honest, practical, and specific.\n```\n"},{"file":"00_Portfolio_Showcase_And_Career_Kit.md","title":"Portfolio Showcase And Career Kit","body":"# Portfolio Showcase And Career Kit\n\n## Purpose\n\nThis kit helps learners translate course work into a credible senior AI PM signal for interviews, internal mobility, public writing, or advisory positioning.\n\nThe goal is not to publish every artifact. The goal is to package the right evidence for the right audience.\n\n---\n\n## Portfolio Formats\n\n| Format | Best for | Notes |\n|---|---|---|\n| Private portfolio packet | Interviews and internal reviews | Can include anonymized detail and richer artifacts |\n| Public case study | Brand building and credibility | Must remove confidential details |\n| Interview-only appendix | Senior AI PM interviews | Short, evidence-rich, and easy to walk through |\n| Executive memo | Internal promotion or leadership buy-in | Focus on decisions, tradeoffs, and launch risk |\n| LinkedIn content series | Visibility and network building | Use lessons and frameworks, not private artifacts |\n\n---\n\n## Public/Private Decision Table\n\n| Artifact | Public? | Private? | Interview-only? | Notes |\n|---|---|---|---|---|\n| Strategy memo | Usually anonymized | Yes | Yes | Remove company strategy and numbers |\n| AI PRD | Usually private | Yes | Yes | Show structure, not sensitive system details |\n| Workflow prototype | Sometimes | Yes | Yes | Use synthetic data |\n| Eval dataset | Sometimes | Yes | Yes | Use synthetic or public examples |\n| Architecture brief | Usually private | Yes | Yes | Avoid internal architecture exposure |\n| Launch review | Usually private | Yes | Yes | Remove security and risk details |\n| Executive story | Yes, in summarized form | Yes | Yes | Keep it concise |\n\n---\n\n## Portfolio Case Study Structure\n\nUse this for public or semi-public versions.\n\n```text\nTitle:\nOne-line product thesis:\n\n1. Problem\nWho is the user?\nWhat workflow was painful?\nWhy did it matter?\n\n2. Why AI\nWhat could simple automation not solve?\nWhat context or reasoning was needed?\n\n3. Product approach\nWhat would the AI system do?\nWhere does human judgment stay?\n\n4. Evaluation\nWhat does good look like?\nWhat failure modes matter?\nHow would quality be measured?\n\n5. Production readiness\nWhat cost, latency, safety, and launch risks were considered?\n\n6. Tradeoffs\nWhat did you choose not to build?\nWhat would you validate next?\n\n7. Result or expected result\nWhat outcome would you measure?\n```\n\n---\n\n## 2-Minute Executive Story\n\nUse this in Week 8.\n\n```text\nThe business problem is [problem].\n\nThe user is [user], and the workflow is [workflow].\n\nAI is useful here because [reason AI is needed], but the non-AI alternative is [alternative].\n\nThe system I would build first is [first release].\n\nThe main technical tradeoff is [tradeoff].\n\nI would evaluate quality using [eval plan].\n\nThe biggest launch risks are [risks], so the launch gates are [gates].\n\nThe first measurable outcome is [metric].\n```\n\n---\n\n## Senior AI PM Interview Story\n\nUse this structure.\n\n| Part | Prompt |\n|---|---|\n| Situation | What product/workflow problem did you choose? |\n| Product judgment | Why was this worth pursuing or reshaping? |\n| Technical tradeoff | What did you choose around model, RAG, tools, autonomy, or build/buy/partner? |\n| Evals | How did you define quality? |\n| Launch risk | What could go wrong in production? |\n| Leadership | How would you work with engineering, design, data, legal, and GTM? |\n| Result | What outcome would prove the product worked? |\n\n---\n\n## Resume Bullets\n\nAdapt these honestly.\n\n```text\nBuilt a senior AI PM portfolio covering product strategy, AI PRD, GenAI workflow design, eval planning, architecture tradeoffs, and production readiness for a [domain] AI product.\n\nDesigned an AI product strategy for [workflow], including non-AI alternatives, data requirements, system behavior, failure modes, and launch gates.\n\nCreated an eval plan with [number] golden dataset rows, failure taxonomy, pass/fail rubric, and launch-blocking quality criteria.\n\nMapped an agentic/RAG workflow with human approval gates, tool boundaries, recovery paths, telemetry requirements, and cost/latency assumptions.\n```\n\n---\n\n## LinkedIn Positioning\n\nUse content that teaches a principle from the work without exposing private detail.\n\nPost ideas:\n\n1. \"The difference between an AI demo and an AI product is evals.\"\n2. \"A senior AI PM should ask these 7 questions before approving an agent.\"\n3. \"Why I now start AI PRDs with failure modes.\"\n4. \"The non-AI alternative is the most underrated AI product strategy tool.\"\n5. \"RAG is not a feature. It is a product trust system.\"\n6. \"Most agentic products should start at autonomy tier 1 or 2.\"\n7. \"Cost per successful workflow matters more than cost per model call.\"\n8. \"A good AI PM portfolio should show launch judgment, not prompt screenshots.\"\n\n---\n\n## Portfolio Review Checklist\n\n- [ ] The product idea has a specific user and workflow.\n- [ ] The AI rationale is clear.\n- [ ] The non-AI alternative is named.\n- [ ] The system map is understandable without code.\n- [ ] The eval plan has real failure cases.\n- [ ] The launch review includes cost, latency, safety, and rollback.\n- [ ] The story explains tradeoffs.\n- [ ] Confidential details are removed or anonymized.\n- [ ] The artifact can be explained in 2 minutes.\n- [ ] The learner can answer hard follow-up questions.\n\n---\n\n## Hard Interview Questions\n\nPractice these before using the portfolio.\n\n1. Why does this need AI?\n2. What is the best non-AI alternative?\n3. What would make you kill this idea?\n4. What failure would most damage user trust?\n5. What data do you need, and what happens if it is missing?\n6. Where would you keep a human in the loop?\n7. How would you measure quality before launch?\n8. Which eval failures block release?\n9. What would drive cost?\n10. What latency does the workflow tolerate?\n11. What would you ship first?\n12. What would you not build?\n13. How would you work with engineering on this?\n14. How would you explain the risk to executives?\n15. What would you monitor after launch?\n\n---\n\n## Final Portfolio Standard\n\nThe portfolio should prove:\n\n> I can lead AI product work through ambiguity, technical tradeoffs, quality evaluation, and production readiness.\n\nAnything that does not support that proof should be cut.\n"},{"file":"00_Marketing_Landing_Page_And_Positioning.md","title":"Marketing, Landing Page, And Positioning","body":"# Marketing, Landing Page, And Positioning\n\n## Purpose\n\nThis document gives the program owner ready-to-use positioning and landing page copy for Production AI PM.\n\nIt centers the course on senior PM outcomes, production credibility, and portfolio proof.\n\n---\n\n## Core Positioning\n\nProduction AI PM is a premium cohort for senior PMs who want to lead GenAI and agentic products from strategy to launch.\n\nIt teaches the work beyond the demo:\n\n- choosing AI opportunities;\n- designing GenAI and agentic workflows;\n- working with AI/ML engineering teams;\n- defining evals and quality bars;\n- reasoning about cost, latency, safety, and launch readiness;\n- building an interview-ready senior AI PM portfolio.\n\n---\n\n## One-Line Offer\n\nLead GenAI and agentic products from strategy to launch with the judgment, technical fluency, eval discipline, and portfolio proof expected of senior AI PMs.\n\n---\n\n## Short Landing Page Hero\n\n### Production AI PM\n\nLead GenAI and agentic products from strategy to launch.\n\nAn 8-week applied cohort for senior PMs who want to move beyond prompt demos and become credible AI product leaders: opportunity selection, system design, RAG and agents, evals, engineering tradeoffs, production readiness, and executive narrative.\n\nPrimary CTA:\n\nApply for the next cohort\n\nSecondary CTA:\n\nDownload the syllabus\n\n---\n\n## Who It Is For\n\nThis cohort is for:\n\n- senior PMs moving into AI PM or GenAI PM roles;\n- product leaders working with AI/ML engineering teams;\n- PMs targeting global or remote AI PM roles;\n- operators who need stronger AI product judgment;\n- PMs who want a portfolio that shows production thinking, not just tool usage.\n\n---\n\n## Who It Is Not For\n\nThis is not for:\n\n- entry-level PMs looking for PM basics;\n- engineers looking for heavy ML math;\n- learners who want a coding bootcamp;\n- people looking only for prompt templates;\n- learners who want AI inspiration without applied work.\n\n---\n\n## Outcome Promise\n\nBy the end, learners will produce a Senior AI PM Portfolio Packet with:\n\n1. AI Product Strategy Memo\n2. AI PRD\n3. Agent/RAG Workflow Prototype\n4. Eval Dataset and Rubric\n5. Technical Architecture Brief\n6. Production Readiness Review\n7. Executive Narrative and Interview Story\n\n---\n\n## Curriculum Section\n\n| Week | Focus | Walk-out artifact |\n|---|---|---|\n| 1 | AI Product Judgment | AI Opportunity One-Pager |\n| 2 | Strategy, Moats, Business Case | AI Product Strategy Memo |\n| 3 | GenAI System Design | AI PRD |\n| 4 | Agentic Product Design | Workflow Prototype + Autonomy Map |\n| 5 | Evals | Eval Dataset + Rubric |\n| 6 | AI/ML Engineering Collaboration | Technical Architecture Brief |\n| 7 | Production Readiness | Risk Register + Launch Review |\n| 8 | Portfolio And Interview Readiness | Final Portfolio Packet |\n\n---\n\n## Differentiators\n\n| Common AI PM course | Production AI PM |\n|---|---|\n| Tool demos | Product judgment and production decisions |\n| Prompt engineering | PRDs, workflows, evals, architecture, launch gates |\n| Strategy only | Strategy plus studio critique and artifacts |\n| Generic AI overview | GenAI, RAG, agents, evals, cost, latency, safety |\n| Certificate-heavy | Portfolio-heavy |\n| Beginner PM content | Built for senior PMs |\n\n---\n\n## Proof Points To Use\n\nUse these proof points once real cohort data exists.\n\n- number of learners;\n- completion rate;\n- portfolio artifacts produced;\n- before/after confidence survey;\n- role transitions or interview outcomes;\n- learner testimonials;\n- public artifact examples;\n- anonymized capstone examples.\n\nUntil then, use curriculum specificity as proof: artifacts, rubrics, evals, technical companion, and launch readiness.\n\n---\n\n## Objection Handling\n\n### \"I do not code. Can I still join?\"\n\nYes. The core path is no-code / low-code. You will learn enough technical fluency to work credibly with AI/ML teams, define evals, and reason about system tradeoffs. Optional advanced labs are available for learners who want API-level depth.\n\n### \"Is this just prompt engineering?\"\n\nNo. Prompts are treated as one part of product behavior. The program focuses on product strategy, system design, RAG and agent workflows, evals, cost, latency, safety, launch readiness, and executive communication.\n\n### \"I already know PM fundamentals.\"\n\nGood. The program assumes that. We spend little time on generic PM basics and focus on the AI-specific judgment senior PMs need.\n\n### \"Can I use a work problem?\"\n\nYes, if you can do so safely. The program includes confidentiality rules and encourages anonymized artifacts when needed.\n\n### \"Will I have something to show at the end?\"\n\nYes. The final output is a Senior AI PM Portfolio Packet with seven artifacts.\n\n---\n\n## Application Questions\n\nUse these to qualify learners.\n\n1. Current role and years in product or product-adjacent work.\n2. What kind of AI product work are you trying to lead?\n3. Are you targeting AI PM roles, internal AI leadership, or portfolio credibility?\n4. What is one AI product idea you may use as your capstone?\n5. Can you commit 2 hours live plus 2 to 4 hours of work weekly?\n6. Do you prefer core path, advanced technical path, or both?\n7. What would make this cohort successful for you?\n\n---\n\n## Sales Page FAQ\n\n### How technical is it?\n\nTechnical enough for senior AI PM credibility, but not a coding bootcamp. You will work with system maps, RAG, agents, evals, traces, cost, latency, and launch risk.\n\n### What tools are used?\n\nNamed tools may include Claude, ChatGPT, Perplexity, n8n, Sheets/Airtable, Figma/FigJam, Lovable/v0/Bolt, and optional eval/tracing tools. The course teaches durable principles so the learning survives tool changes.\n\n### What is the weekly workload?\n\n2 hours live plus 2 to 4 hours of assignment work. Optional advanced labs may add 1 to 2 hours.\n\n### What if I cannot share my company work?\n\nUse an anonymized version, a public-domain example, or the shared Customer Success Copilot case.\n\n### What is the final deliverable?\n\nA Senior AI PM Portfolio Packet and interview narrative.\n\n---\n\n## CTA Copy Options\n\n- Apply for the next cohort\n- Join the waitlist\n- Download the syllabus\n- Book a fit call\n- Get the portfolio checklist\n\n---\n\n## Short Social Copy\n\nProduction AI PM is for senior PMs who want to lead GenAI and agentic products beyond the demo.\n\nIn 8 weeks, learners build a portfolio across strategy, AI PRD, agent/RAG workflow, evals, architecture, launch readiness, and executive narrative.\n\nNot PM basics. Not prompt tricks. Not a coding bootcamp.\n\nThe goal is simple: become credible in the product, technical, and launch decisions that AI products actually require.\n"},{"file":"00_Premium_AddOns_Playbook.md","title":"Premium Add-Ons Playbook","body":"# Premium Add-Ons Playbook\n\n## Purpose\n\nThis playbook defines optional premium services that can sit above the core cohort.\n\nUse these to create higher-touch tiers without changing the main curriculum.\n\n---\n\n## Add-On Menu\n\n| Add-on | Best for | Format |\n|---|---|---|\n| 1:1 Capstone Review | Learners who want sharper portfolio artifacts | 45 or 60 minutes |\n| Mock AI PM Interview | Learners targeting AI PM roles | 60 minutes |\n| Resume, LinkedIn, Portfolio Review | Learners using the cohort for career transition | 60 minutes |\n| Advanced Technical Lab Review | Learners building deeper technical prototypes | 60 to 90 minutes |\n| Executive Narrative Coaching | Product leaders using the work internally | 45 minutes |\n\n---\n\n## 1:1 Capstone Review\n\n### Inputs\n\nLearner submits:\n\n- strategy memo;\n- AI PRD;\n- eval plan;\n- architecture brief;\n- launch readiness review;\n- specific question they want answered.\n\n### Session Flow\n\n| Time | Activity |\n|---|---|\n| 0-5 min | Clarify goal |\n| 5-20 min | Review strategy and AI necessity |\n| 20-35 min | Review system, evals, and launch risk |\n| 35-50 min | Portfolio positioning |\n| 50-60 min | Next actions |\n\n### Output\n\nShort written note:\n\n```text\nStrongest portfolio signal:\nWeakest assumption:\nMost important production risk:\nArtifact to improve first:\nNext three actions:\n```\n\n---\n\n## Mock AI PM Interview\n\n### Interview Areas\n\n- AI product strategy;\n- system design for PMs;\n- RAG and agent tradeoffs;\n- evals and quality;\n- cost and latency;\n- safety and launch readiness;\n- cross-functional leadership.\n\n### Question Bank\n\n1. Walk me through your AI product capstone.\n2. Why does this need AI?\n3. What would the non-AI version be?\n4. What data does the system need?\n5. Where would you use RAG?\n6. Where would you allow autonomy?\n7. What evals would block launch?\n8. What is the biggest production risk?\n9. How would you work with engineering?\n10. What would you ship first?\n\n### Feedback Output\n\n```text\nInterview readiness:\nBest answer:\nWeakest answer:\nTechnical clarity:\nProduct judgment:\nRecommended practice:\n```\n\n---\n\n## Resume, LinkedIn, Portfolio Review\n\n### Review Areas\n\n- role positioning;\n- AI PM keywords without exaggeration;\n- portfolio link strategy;\n- artifact selection;\n- public/private boundaries;\n- proof of seniority;\n- clarity of business impact.\n\n### Output\n\n```text\nPositioning headline:\nTop 3 resume edits:\nTop 3 LinkedIn edits:\nPortfolio artifact to feature:\nArtifact to keep private:\n30-day positioning plan:\n```\n\n---\n\n## Advanced Technical Lab Review\n\n### Suitable Learners\n\nLearners who built or directed:\n\n- n8n workflow;\n- RAG prototype;\n- tool-calling demo;\n- eval table;\n- tracing/eval setup;\n- lightweight API prototype.\n\n### Review Areas\n\n- workflow clarity;\n- data and context boundaries;\n- tool/action safety;\n- eval coverage;\n- trace quality;\n- cost and latency assumptions;\n- launch readiness.\n\n### Output\n\n```text\nTechnical credibility signal:\nMain architecture gap:\nEval gap:\nSafety or permission risk:\nPortfolio-ready explanation:\n```\n\n---\n\n## Executive Narrative Coaching\n\n### Suitable Learners\n\nProduct leaders using the program for internal influence, not only career transition.\n\n### Review Areas\n\n- business problem;\n- why AI;\n- first release;\n- risk controls;\n- investment ask;\n- resourcing ask;\n- executive objections.\n\n### Output\n\n```text\nExecutive thesis:\nDecision needed:\nRisk to address upfront:\nSlide or memo structure:\nTwo-minute narrative:\n```\n\n---\n\n## Tier Packaging Ideas\n\nUse neutral tier names.\n\n| Tier | Includes |\n|---|---|\n| Core Cohort | Live sessions, workbooks, decks, portfolio packet |\n| Portfolio Cohort | Core + 1:1 capstone review |\n| Career Cohort | Core + mock interview + resume/LinkedIn/portfolio review |\n| Technical Cohort | Core + advanced lab review |\n| Executive Cohort | Core + capstone review + executive narrative coaching |\n\nAvoid overloading the core cohort. Premium add-ons should create leverage, not operational chaos.\n\n---\n\n## Operational Rules\n\n- Schedule add-ons only after the relevant artifact exists.\n- Require pre-work at least 24 hours before the session.\n- Keep each add-on focused on one outcome.\n- Send a short written summary after the session.\n- Do not rewrite learner artifacts for them.\n- Keep confidentiality rules active.\n\n---\n\n## Add-On Booking Questions\n\n1. What artifact do you want reviewed?\n2. What decision are you stuck on?\n3. What is your target outcome?\n4. Is this for internal use, interview use, or public portfolio use?\n5. What must remain private?\n\n---\n\n## Success Bar\n\nA premium add-on is successful when the learner leaves with:\n\n- one sharper artifact;\n- one clearer story;\n- one visible technical or strategic tradeoff;\n- one next action they can execute within 48 hours.\n"},{"file":"00_Program_QA_And_Launch_Checklist.md","title":"Program QA And Launch Checklist","body":"# Program QA And Launch Checklist\n\n## Purpose\n\nUse this checklist before launching or running a cohort.\n\nIt is meant to catch missing docs, broken links, unclear operations, and weak learner expectations before the cohort starts.\n\n---\n\n## Package Completeness\n\n- [ ] `README.md` is current.\n- [ ] `00_Master_Index.md` is current.\n- [ ] Learner handbook exists.\n- [ ] Tool setup doc exists.\n- [ ] Advanced technical companion exists.\n- [ ] Instructor delivery playbook exists.\n- [ ] Assessment rubrics and certification criteria exist.\n- [ ] Capstone casebook exists.\n- [ ] Prompt and workflow library exists.\n- [ ] Onboarding and email templates exist.\n- [ ] Portfolio showcase and career kit exists.\n- [ ] Marketing and landing page copy exists.\n- [ ] Premium add-ons playbook exists.\n- [ ] Cohort tracker exists.\n- [ ] Local HTML navigator exists.\n\n---\n\n## Weekly Content QA\n\nFor each week:\n\n- [ ] Facilitator script exists.\n- [ ] Learner workbook exists.\n- [ ] Presenter deck exists.\n- [ ] Learner deck exists.\n- [ ] Presenter deck opens the matching learner deck.\n- [ ] Slide sync works.\n- [ ] Workbook assignment matches the portfolio artifact.\n- [ ] Facilitator script matches the 120-minute session format.\n- [ ] No old branding or unrelated platform references.\n- [ ] No unresolved placeholders.\n\n---\n\n## Learner Readiness\n\n- [ ] Application or screening form is ready.\n- [ ] Learner handbook is ready to send.\n- [ ] Tool setup instructions are ready.\n- [ ] Capstone selection instructions are ready.\n- [ ] Portfolio packet template is ready.\n- [ ] Confidentiality policy is communicated.\n- [ ] AI use policy is communicated.\n- [ ] Submission method is defined.\n- [ ] Feedback turnaround time is defined.\n\n---\n\n## Instructor Readiness\n\n- [ ] Instructor has reviewed all weekly scripts.\n- [ ] Shared Customer Success Copilot case is prepared.\n- [ ] Strong and weak sample artifacts are prepared.\n- [ ] Critique norms are clear.\n- [ ] Feedback template is ready.\n- [ ] Parking lot location is ready.\n- [ ] Attendance tracking is ready.\n- [ ] TA role is defined, if applicable.\n\n---\n\n## Tool Readiness\n\n- [ ] Video platform is selected.\n- [ ] Recording policy is defined.\n- [ ] Community channel is selected.\n- [ ] Submission folder or LMS space is ready.\n- [ ] Learner docs are shareable.\n- [ ] Spreadsheet templates are shareable.\n- [ ] n8n or workflow demo is ready.\n- [ ] Backup screenshots or fallback demo exists.\n\n---\n\n## Sales And Marketing Readiness\n\n- [ ] Landing page copy is customized.\n- [ ] Application questions are finalized.\n- [ ] Pricing and tiers are defined.\n- [ ] Premium add-ons are defined.\n- [ ] FAQ is ready.\n- [ ] Refund, deferral, and cancellation policy is ready.\n- [ ] Public examples are privacy-safe.\n- [ ] Testimonials are requested only after real learner outcomes exist.\n\n---\n\n## Launch Week Checklist\n\n- [ ] Send welcome email.\n- [ ] Send setup checklist.\n- [ ] Add learners to community.\n- [ ] Share calendar invites.\n- [ ] Share learner handbook.\n- [ ] Share tool setup doc.\n- [ ] Share portfolio packet template.\n- [ ] Confirm capstone idea prompt.\n- [ ] Test Week 1 decks.\n- [ ] Prepare Week 1 critique examples.\n\n---\n\n## Post-Cohort Checklist\n\n- [ ] Confirm completion criteria.\n- [ ] Send certificates, if applicable.\n- [ ] Send final portfolio polish plan.\n- [ ] Request testimonials.\n- [ ] Collect feedback survey.\n- [ ] Review attendance and completion data.\n- [ ] Identify weak sessions or artifacts.\n- [ ] Update curriculum before next cohort.\n\n---\n\n## Final QA Rule\n\nThe program is ready to run when a learner can answer these before Week 1:\n\n- What will I build?\n- What tools do I need?\n- What does good work look like?\n- How will I get feedback?\n- What will I leave with?\n\nAnd the instructor can answer:\n\n- What happens in every session?\n- What is the shared case?\n- What artifact is due each week?\n- How will work be assessed?\n- What does completion mean?\n"},{"file":"Week 01 - AI Product Judgment for Senior PMs/W01_Facilitator_Script.md","title":"Facilitator Script - AI Product Judgment for Senior PMs (Session 1 of 8)","body":"# Facilitator Script - AI Product Judgment for Senior PMs (Session 1 of 8)\n\n**Subtitle:** Decide which AI ideas deserve to be built and which should be killed early.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders building AI product judgment.  \n**Spine:** Judgment Reset -> Opportunity Filter -> Shared Case Critique -> Capstone Selection.  \n**Hands-on share:** ~45% (about 54 minutes of learner activity).  \n**Session artifact:** AI Opportunity One-Pager.  \n**Tools assumed available:** Claude or ChatGPT, Perplexity, shared workbook, portfolio packet template.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Send learner workbook and portfolio packet template.\n- [ ] Ask learners to bring one AI product idea from work or a domain they understand.\n- [ ] Prepare 3 example ideas: one strong AI product, one workflow automation, one weak AI wrapper.\n- [ ] Pre-load shared B2B SaaS Customer Success Copilot case.\n- [ ] Open parking lot doc and visible timer.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening And Promise (0:00-0:10)\n\n**Say:** \"Most AI product failures do not start with the model. They start with a PM choosing the wrong problem.\"\n\nAsk chat: \"In one phrase, where do AI ideas usually go wrong in your company?\"\n\nRead 5-6 answers. Bridge to the core promise:\n\n**Say:** \"Today is not about making every idea sound AI-ready. It is about building the judgment to reject weak ideas before they waste engineering time.\"\n\n## Block 1 - Strategy Lens: The AI Opportunity Filter (0:10-0:35)\n\nTeach the six-part filter:\n\n1. Pain: frequent, expensive, or high-stakes.\n2. Workflow: AI changes the work, not just the UI.\n3. Context: the system can access the information needed.\n4. Quality tolerance: the user can handle probabilistic output.\n5. Economics: value exceeds inference, review, and operational cost.\n6. Risk: failure modes are understandable and controllable.\n\n**Studio prompt:** \"Score your own idea from 1-5 on each dimension. Do not average the score yet. Circle the weakest dimension.\"\n\n## Block 2 - Applied Walkthrough: Three Ideas (0:35-0:55)\n\nShow 3 examples:\n\n- Customer Success Copilot for B2B SaaS.\n- \"AI dashboard summarizer\" with no workflow integration.\n- Automated refund approval agent.\n\nFor each, ask:\n\n- Is AI needed?\n- Is workflow automation enough?\n- What would make this unsafe?\n- What evidence would change our mind?\n\n## Hard Break (0:55-1:05)\n\nReal break. Keep the timer visible.\n\n## Block 3 - Studio Critique: Learner Ideas (1:05-1:40)\n\nPut learners in pairs or small groups.\n\nEach learner presents:\n\n1. User and workflow.\n2. Current pain.\n3. Why AI might help.\n4. Weakest part of the opportunity filter.\n5. One non-AI alternative.\n\nCritique rule: peers must improve the idea or kill it. No polite vagueness.\n\n## Block 4 - Artifact Build: Opportunity One-Pager (1:40-1:55)\n\nLearners draft:\n\n- Problem.\n- Target user.\n- Workflow.\n- Why AI.\n- Why not simple automation.\n- Key data/context.\n- Main risk.\n- Decision: pursue, reshape, or kill.\n\n## Block 5 - Close (1:55-2:00)\n\n**Say:** \"A senior AI PM is not the person with the most AI ideas. It is the person who knows which ideas deserve engineering time.\"\n\nAssignment: complete the AI Opportunity One-Pager before Session 2.\n\nNext: AI Strategy, Moats, and Business Case.\n\n---\n\n## Contingencies\n\n**If learners bring weak ideas:** use that as the lesson. Make the rewrite the artifact.  \n**If no one shares:** critique the 3 prepared examples in more depth.  \n**If tool access fails:** run the session entirely from workbook and shared doc.\n\n"},{"file":"Week 01 - AI Product Judgment for Senior PMs/W01_Learner_Workbook.md","title":"Production AI PM - Session 1 Workbook","body":"# Production AI PM - Session 1 Workbook\n\n## AI Product Judgment for Senior PMs\n\nToday you turn AI enthusiasm into product judgment.\n\nBy the end of this 120-minute session, you will have an **AI Opportunity One-Pager** for a product idea you may use as your capstone.\n\nOne rule for today: **Do not defend the AI idea. Test whether it deserves to exist.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Claude or ChatGPT open.\n- [ ] Portfolio packet template open.\n- [ ] One AI product idea from your work or domain.\n- [ ] Notes app or doc for your one-pager.\n\n---\n\n## Exercise 1: The AI Opportunity Filter\n\nScore your idea from 1 to 5.\n\n| Dimension | Question | Score |\n|---|---|---:|\n| Pain | Is the pain frequent, expensive, or high-stakes? | |\n| Workflow | Does AI change the work, not just the UI? | |\n| Context | Can the system access enough information to help? | |\n| Quality tolerance | Can users handle probabilistic output? | |\n| Economics | Is value likely to exceed cost and review effort? | |\n| Risk | Are failure modes understandable and controllable? | |\n\nWeakest dimension:\n\n---\n\n## Exercise 2: Non-AI Alternative\n\nBefore you choose AI, write the best non-AI version.\n\n- Rules/workflow version:\n- Human ops version:\n- Dashboard/reporting version:\n- Template/checklist version:\n\nWhat does AI add that these do not?\n\n---\n\n## Studio Critique Notes\n\nUse this while reviewing a peer's idea.\n\n| Question | Notes |\n|---|---|\n| What user pain is real? | |\n| What part sounds like AI theater? | |\n| What data/context is missing? | |\n| What failure would hurt trust? | |\n| Would you pursue, reshape, or kill it? | |\n\n---\n\n## Portfolio Artifact: AI Opportunity One-Pager\n\n### Product idea\n\n### Target user\n\n### Workflow being improved\n\n### Current pain\n\n### Why AI\n\n### Why not simple automation\n\n### Required data/context\n\n### Main risk\n\n### Decision\n\nChoose one: pursue / reshape / kill.\n\n### What I need to learn next\n\n---\n\n## Take-Home\n\nBefore Session 2, refine your one-pager and add one paragraph answering:\n\n1. What would make this idea strategically defensible?\n2. What evidence would make you kill it?\n\n"},{"file":"Week 02 - AI Strategy Moats and Business Case/W02_Facilitator_Script.md","title":"Facilitator Script - AI Strategy, Moats, and Business Case (Session 2 of 8)","body":"# Facilitator Script - AI Strategy, Moats, and Business Case (Session 2 of 8)\n\n**Subtitle:** Turn an AI idea into a defensible product strategy and business case.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** Strategy Lens -> Moat Map -> Business Case Critique -> Strategy Memo.  \n**Hands-on share:** ~45% (about 54 minutes).  \n**Session artifact:** AI Product Strategy Memo v1.  \n**Tools assumed available:** Claude or ChatGPT, Perplexity, shared case, portfolio packet.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Review 3-5 learner opportunity one-pagers.\n- [ ] Prepare shared case strategy memo outline.\n- [ ] Prepare examples of model moat, data moat, workflow moat, and distribution moat.\n- [ ] Open market research examples.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"Last week we asked whether an AI idea deserves to exist. Today we ask whether it deserves a roadmap.\"\n\nAsk chat: \"What makes an AI product hard to copy?\"\n\n## Block 1 - Strategy Lens: Moats Beyond The Model (0:10-0:35)\n\nTeach four defensibility layers:\n\n1. Workflow depth: the product sits inside repeated work.\n2. Data advantage: proprietary context improves outcomes.\n3. Distribution: the product reaches users at the moment of need.\n4. Learning loop: usage improves the system and roadmap.\n\nWarn against thin wrappers:\n\n**Say:** \"If the only hard part is calling a frontier model, you have a feature demo, not a product strategy.\"\n\n## Block 2 - Applied Walkthrough: Shared Case (0:35-0:55)\n\nUse Customer Success Copilot.\n\nWalk through:\n\n- Business outcome: reduce churn risk and improve expansion timing.\n- User workflow: CSM account review and next-best-action planning.\n- Data advantage: product usage, support tickets, CRM, call notes.\n- Risk: incorrect recommendations, account privacy, hallucinated customer claims.\n\n## Hard Break (0:55-1:05)\n\nReal break. Keep the timer visible.\n\n## Block 3 - Studio Critique: Learner Strategy (1:05-1:42)\n\nLearners revise their capstone idea using the strategy memo structure:\n\n1. Business outcome.\n2. User workflow.\n3. Advantage.\n4. Build / buy / partner.\n5. First 90 days.\n6. Kill criteria.\n\nCritique 2-3 examples live.\n\n## Block 4 - Artifact Build: Strategy Memo (1:42-1:55)\n\nLearners draft a one-page strategy memo.\n\nQuality bar:\n\n- Names a business outcome.\n- Names a workflow.\n- Names an advantage.\n- Names a risk.\n- Names a first release.\n\n## Block 5 - Close (1:55-2:00)\n\nAssignment: submit AI Product Strategy Memo v1 before Session 3.\n\nNext: GenAI System Design for PMs.\n\n---\n\n## Contingencies\n\n**If learner ideas are too broad:** force a narrower workflow.  \n**If learners over-index on model choice:** redirect to workflow, data, and distribution.  \n**If discussion becomes startup-pitch heavy:** bring it back to senior PM execution: roadmap, risk, and launch constraints.\n\n"},{"file":"Week 02 - AI Strategy Moats and Business Case/W02_Learner_Workbook.md","title":"Production AI PM - Session 2 Workbook","body":"# Production AI PM - Session 2 Workbook\n\n## AI Strategy, Moats, and Business Case\n\nToday you turn an AI opportunity into a strategy a senior product leader can defend.\n\nBy the end of this 120-minute session, you will have **AI Product Strategy Memo v1**.\n\nOne rule for today: **If the product has no workflow advantage, data advantage, or distribution advantage, keep digging.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Session 1 AI Opportunity One-Pager open.\n- [ ] Portfolio packet template open.\n- [ ] Access to a research tool.\n- [ ] Notes doc open.\n\n---\n\n## Exercise 1: Moat Map\n\n| Advantage type | Does your product have it? | Evidence |\n|---|---|---|\n| Workflow depth | | |\n| Proprietary data/context | | |\n| Distribution at moment of need | | |\n| Learning loop | | |\n| Switching cost | | |\n\nStrongest advantage:\n\nWeakest advantage:\n\n---\n\n## Exercise 2: Build / Buy / Partner / Wait\n\n| Option | When it makes sense | Your notes |\n|---|---|---|\n| Build | Differentiated workflow or data advantage | |\n| Buy | Commodity capability, speed matters | |\n| Partner | Need distribution, integration, or expertise | |\n| Wait | Risk or economics are not ready | |\n\nRecommendation:\n\n---\n\n## Strategy Memo Template\n\n### Product thesis\n\n### Target user and workflow\n\n### Business outcome\n\n### Why AI now\n\n### Defensibility\n\n### Build / buy / partner recommendation\n\n### First 90 days\n\n### Risks and kill criteria\n\n---\n\n## Studio Critique Notes\n\n| Question | Notes |\n|---|---|\n| Is the strategy specific enough? | |\n| Is the moat real or generic? | |\n| What would engineering challenge? | |\n| What would leadership challenge? | |\n| What should be cut from v1? | |\n\n---\n\n## Take-Home\n\nBefore Session 3, submit Strategy Memo v1 and add:\n\n1. the exact data/context the AI system will need;\n2. the first user workflow you would prototype.\n\n"},{"file":"Week 03 - GenAI System Design for PMs/W03_Facilitator_Script.md","title":"Facilitator Script - GenAI System Design for PMs (Session 3 of 8)","body":"# Facilitator Script - GenAI System Design for PMs (Session 3 of 8)\n\n**Subtitle:** Explain a GenAI system clearly enough to work credibly with engineering.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** System Map -> Context Decisions -> PRD Translation -> Architecture Critique.  \n**Hands-on share:** ~45% (about 54 minutes).  \n**Session artifact:** AI PRD v1.  \n**Tools assumed available:** Claude or ChatGPT, shared system map, portfolio packet, optional Figma/FigJam.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Prepare a plain-English GenAI system map.\n- [ ] Prepare examples of prompt-only, RAG, tool-use, workflow, and fine-tuning decisions.\n- [ ] Prepare shared Customer Success Copilot architecture.\n- [ ] Open learner strategy memos for reference.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"A senior AI PM does not need to write the system. But they must know what system they are asking engineering to build.\"\n\nAsk chat: \"Which part of GenAI architecture feels most fuzzy: prompts, RAG, tools, memory, model choice, evals, or telemetry?\"\n\n## Block 1 - Strategy Lens: The GenAI System Map (0:10-0:35)\n\nTeach the seven-part map:\n\n1. User surface.\n2. Instruction layer.\n3. Model.\n4. Context and retrieval.\n5. Tools/actions.\n6. Output and UX.\n7. Telemetry and evals.\n\nEmphasize the PM role:\n\n**Say:** \"Your job is to define behavior, constraints, quality bar, and tradeoffs. Engineering decides implementation details, but you must know what questions to ask.\"\n\n## Block 2 - Applied Walkthrough: Shared Case (0:35-0:55)\n\nMap Customer Success Copilot:\n\n- Inputs: account notes, CRM data, support tickets, usage trends.\n- Retrieval: account history and playbooks.\n- Tools: CRM update, ticket lookup, meeting summary.\n- Output: account risk summary and recommended next action.\n- Human control: CSM approval before external communication.\n\n## Hard Break (0:55-1:05)\n\nReal break.\n\n## Block 3 - Studio Critique: Capstone System Maps (1:05-1:42)\n\nLearners draft their own system map.\n\nCritique with five questions:\n\n1. What context must the model see?\n2. What should never enter the context?\n3. What tools can it use?\n4. What needs human approval?\n5. What telemetry proves quality?\n\nReview 2-3 learner maps live.\n\n## Block 4 - Artifact Build: AI PRD v1 (1:42-1:55)\n\nLearners draft PRD sections:\n\n- User journey.\n- System behavior.\n- Inputs and context.\n- Tools/actions.\n- Failure modes.\n- Acceptance criteria.\n\n## Block 5 - Close (1:55-2:00)\n\nAssignment: complete AI PRD v1 before Session 4.\n\nNext: Agentic Product Design.\n\n---\n\n## Contingencies\n\n**If learners get too technical:** return to behavior and tradeoffs.  \n**If learners stay too abstract:** force them to name inputs, context, tools, and approval points.  \n**If tool examples distract:** remind the room that tools are implementation choices; the PRD defines product behavior.\n\n"},{"file":"Week 03 - GenAI System Design for PMs/W03_Learner_Workbook.md","title":"Production AI PM - Session 3 Workbook","body":"# Production AI PM - Session 3 Workbook\n\n## GenAI System Design for PMs\n\nToday you convert strategy into system behavior.\n\nBy the end of this 120-minute session, you will have **AI PRD v1** for your capstone.\n\nOne rule for today: **If you cannot explain the system in plain English, you are not ready to ask engineering to build it.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Strategy Memo v1 open.\n- [ ] Portfolio packet open.\n- [ ] Notes doc or diagram tool open.\n\n---\n\n## Exercise 1: GenAI System Map\n\n| System component | Your capstone |\n|---|---|\n| User surface | |\n| Instruction layer | |\n| Model assumption | |\n| Context/RAG | |\n| Tools/actions | |\n| Output format | |\n| Telemetry/evals | |\n\n---\n\n## Exercise 2: Decision Table\n\n| Choice | Use when | Your decision |\n|---|---|---|\n| Prompt only | Task is narrow and context fits in prompt | |\n| RAG | Answers need private or changing knowledge | |\n| Workflow | Steps are known and predictable | |\n| Agent | Steps are dynamic and tool-driven | |\n| Fine-tuning | Behavior/style must be learned repeatedly | |\n| Rules | Determinism or compliance matters | |\n\n---\n\n## AI PRD v1 Template\n\n### User journey\n\n### System behavior\n\n### Inputs\n\n### Context required\n\n### Retrieval sources\n\n### Tools/actions\n\n### Output format\n\n### Human approval points\n\n### Failure modes\n\n| Failure | User impact | Detection | Mitigation |\n|---|---|---|---|\n| | | | |\n| | | | |\n| | | | |\n\n### Acceptance criteria\n\n- Must do:\n- Must not do:\n- Escalates when:\n- Refuses when:\n- Logs when:\n\n---\n\n## Studio Critique Notes\n\n| Question | Notes |\n|---|---|\n| What is underspecified? | |\n| What would engineering ask next? | |\n| What data source is risky? | |\n| What tool/action needs approval? | |\n| What should be measured? | |\n\n---\n\n## Take-Home\n\nBefore Session 4, refine AI PRD v1 and prepare a workflow sketch with:\n\n1. the steps the system should take;\n2. the points where human approval is required.\n\n"},{"file":"Week 04 - Agentic Product Design/W04_Facilitator_Script.md","title":"Facilitator Script - Agentic Product Design (Session 4 of 8)","body":"# Facilitator Script - Agentic Product Design (Session 4 of 8)\n\n**Subtitle:** Design safe autonomy: workflows, tools, approvals, and recovery paths.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** Workflows vs Agents -> Autonomy Levels -> Tool and Approval Design -> Prototype Review.  \n**Hands-on share:** ~50% (about 60 minutes).  \n**Session artifact:** Agent/RAG Workflow Prototype v1 and Autonomy Map.  \n**Tools assumed available:** n8n or workflow tool, AI PRD v1, shared workflow sketch, portfolio packet.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Prepare simple n8n workflow skeleton.\n- [ ] Prepare autonomy-level examples.\n- [ ] Prepare approval gate examples.\n- [ ] Prepare fallback static screenshots for tool failure.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"An agent is not a chatbot with ambition. It is a product surface that can decide, use tools, and sometimes act.\"\n\nAsk chat: \"What action would you never allow an AI system to take without approval?\"\n\n## Block 1 - Strategy Lens: Workflows Before Agents (0:10-0:35)\n\nTeach:\n\n1. Workflow: known steps, predictable path.\n2. Agent: dynamic steps, tool use, environmental feedback.\n3. Autonomy tiers: suggest, draft, prepare, execute with approval, execute autonomously.\n4. Tool boundaries: what it can read, write, change, or trigger.\n5. Guardrails outside the model: permissions, budgets, stop conditions, rollback.\n\n## Block 2 - Applied Walkthrough: Shared Case (0:35-0:55)\n\nCustomer Success Copilot workflow:\n\n1. Pull account data.\n2. Summarize risk.\n3. Retrieve playbook.\n4. Draft recommended action.\n5. Ask CSM for approval.\n6. Log decision.\n\nShow which steps are workflow, which are model calls, and which require human approval.\n\n## Hard Break (0:55-1:05)\n\nReal break.\n\n## Block 3 - Studio: Autonomy Map (1:05-1:35)\n\nLearners map their capstone:\n\n- Step.\n- AI role.\n- Human role.\n- Tool/data.\n- Approval needed.\n- Failure recovery.\n\nCritique for excessive agency.\n\n## Block 4 - Prototype Sketch Or Build (1:35-1:55)\n\nLearners either:\n\n- sketch the workflow in workbook/FigJam; or\n- build a minimal n8n workflow with mock data.\n\nQuality bar:\n\n- At least 4 steps.\n- At least 1 human approval gate.\n- At least 1 failure recovery path.\n- At least 1 telemetry event.\n\n## Block 5 - Close (1:55-2:00)\n\nAssignment: finish workflow prototype or sketch and autonomy map.\n\nNext: Evals as the New PRD.\n\n---\n\n## Contingencies\n\n**If n8n fails:** switch to workflow sketching in the workbook.  \n**If learners overbuild:** force the smallest workflow that demonstrates the core product behavior.  \n**If learners want full autonomy:** ask what failure would trigger rollback.\n\n"},{"file":"Week 04 - Agentic Product Design/W04_Learner_Workbook.md","title":"Production AI PM - Session 4 Workbook","body":"# Production AI PM - Session 4 Workbook\n\n## Agentic Product Design\n\nToday you design safe autonomy.\n\nBy the end of this 120-minute session, you will have an **Agent/RAG Workflow Prototype v1** or workflow sketch, plus an **Autonomy Map**.\n\nOne rule for today: **Start with workflow. Add autonomy only where it improves measurable outcomes.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] AI PRD v1 open.\n- [ ] n8n or diagram tool open.\n- [ ] Portfolio packet open.\n\n---\n\n## Exercise 1: Workflow vs Agent\n\n| Product step | Fixed workflow or agentic? | Why? |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n| | | |\n\n---\n\n## Exercise 2: Autonomy Levels\n\n| Level | Meaning | Use in your capstone? |\n|---|---|---|\n| Suggest | AI recommends, human acts | |\n| Draft | AI drafts, human edits | |\n| Prepare | AI prepares action, human approves | |\n| Execute with approval | AI executes after approval | |\n| Execute autonomously | AI acts within strict scope | |\n\n---\n\n## Autonomy Map\n\n| Step | AI role | Human role | Tool/data used | Approval needed? | Recovery path |\n|---|---|---|---|---|---|\n| 1 | | | | | |\n| 2 | | | | | |\n| 3 | | | | | |\n| 4 | | | | | |\n\n---\n\n## Tool Design Checklist\n\nFor every tool/action:\n\n- What can the AI read?\n- What can the AI write?\n- What can the AI trigger?\n- What is out of scope?\n- What argument validation is needed?\n- What should be logged?\n\n---\n\n## Prototype Quality Bar\n\nYour prototype or sketch must show:\n\n- [ ] at least 4 workflow steps;\n- [ ] at least 1 model decision;\n- [ ] at least 1 tool/data dependency;\n- [ ] at least 1 human approval gate;\n- [ ] at least 1 failure recovery path;\n- [ ] at least 1 telemetry event.\n\n---\n\n## Take-Home\n\nBefore Session 5, produce 5-10 sample inputs/outputs from your workflow. These will become your first eval rows.\n\n"},{"file":"Week 05 - Evals as the New PRD/W05_Facilitator_Script.md","title":"Facilitator Script - Evals as the New PRD (Session 5 of 8)","body":"# Facilitator Script - Evals as the New PRD (Session 5 of 8)\n\n**Subtitle:** Define and measure AI quality before launch.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** Eval Mindset -> Trace Review -> Golden Dataset -> Rubric Critique.  \n**Hands-on share:** ~50% (about 60 minutes).  \n**Session artifact:** Eval Dataset, Eval Rubric, and Failure Mode Taxonomy.  \n**Tools assumed available:** Spreadsheet, sample outputs/traces, AI PRD, workflow prototype.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Prepare 6 sample traces: 2 good, 2 borderline, 2 bad.\n- [ ] Prepare spreadsheet eval template.\n- [ ] Prepare failure taxonomy examples.\n- [ ] Ask learners to bring sample inputs/outputs from their workflow.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"In normal software, a PRD can define expected behavior. In AI products, the PRD is not complete until it defines how quality will be judged.\"\n\nAsk chat: \"What would be a catastrophic wrong answer for your capstone?\"\n\n## Block 1 - Strategy Lens: Evals As Product Management (0:10-0:35)\n\nTeach:\n\n1. Happy-path demos are not evidence.\n2. Error analysis comes before dashboards.\n3. Golden datasets capture what the product must handle.\n4. Rubrics make judgment repeatable.\n5. LLM-as-judge is useful only after human alignment.\n6. Evals become roadmap and release gates.\n\n## Block 2 - Applied Walkthrough: Trace Review (0:35-0:55)\n\nShow sample traces for Customer Success Copilot.\n\nClassify failures:\n\n- unsupported claim;\n- wrong account context;\n- weak recommendation;\n- unsafe action;\n- missing escalation;\n- bad tone.\n\n## Hard Break (0:55-1:05)\n\nReal break.\n\n## Block 3 - Studio: Build Golden Dataset (1:05-1:38)\n\nLearners create 10 rows:\n\n- ID.\n- Input.\n- Context.\n- Expected behavior.\n- Failure category.\n- Severity.\n\nReview 2-3 learner rows live and improve specificity.\n\n## Block 4 - Rubric Critique (1:38-1:55)\n\nLearners draft pass/fail rubric criteria.\n\nQuality bar:\n\n- binary or clear thresholds;\n- tied to user/business risk;\n- includes grounding and escalation;\n- can catch regressions.\n\n## Block 5 - Close (1:55-2:00)\n\nAssignment: expand eval dataset to 20 rows and finalize rubric.\n\nNext: Working with AI/ML Engineering Teams.\n\n---\n\n## Contingencies\n\n**If learners write vague evals:** force a concrete input and expected behavior.  \n**If learners obsess over numeric scores:** redirect to failure categories and pass/fail judgment.  \n**If no traces exist:** use mocked outputs from the shared case.\n\n"},{"file":"Week 05 - Evals as the New PRD/W05_Learner_Workbook.md","title":"Production AI PM - Session 5 Workbook","body":"# Production AI PM - Session 5 Workbook\n\n## Evals as the New PRD\n\nToday you define what quality means before launch.\n\nBy the end of this 120-minute session, you will have an **Eval Dataset**, **Eval Rubric**, and **Failure Mode Taxonomy**.\n\nOne rule for today: **If your eval cannot catch a bad launch, it is not specific enough.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] AI PRD v1 open.\n- [ ] Workflow prototype or sketch open.\n- [ ] 5-10 sample inputs/outputs ready.\n- [ ] Spreadsheet open.\n\n---\n\n## Exercise 1: Failure Mode Taxonomy\n\n| Failure category | Meaning | Example from your capstone |\n|---|---|---|\n| Unsupported claim | AI says something not grounded in context | |\n| Wrong context | AI uses wrong user/account/data | |\n| Bad recommendation | Output is plausible but low quality | |\n| Unsafe action | AI suggests or triggers risky behavior | |\n| Missing escalation | AI should ask human but does not | |\n| UX/tone failure | Output damages trust or clarity | |\n\nAdd your own category:\n\n---\n\n## Exercise 2: Golden Dataset\n\n| ID | Input | Context | Expected behavior | Failure category | Severity |\n|---|---|---|---|---|---|\n| 001 | | | | | |\n| 002 | | | | | |\n| 003 | | | | | |\n| 004 | | | | | |\n| 005 | | | | | |\n\n---\n\n## Exercise 3: Eval Rubric\n\n| Criterion | Pass | Fail |\n|---|---|---|\n| Groundedness | | |\n| Task completion | | |\n| Action safety | | |\n| Escalation behavior | | |\n| User trust / tone | | |\n\n---\n\n## Trace Review Notes\n\n| Trace | What happened | Failure? | What should change? |\n|---|---|---|---|\n| | | | |\n| | | | |\n| | | | |\n\n---\n\n## Take-Home\n\nBefore Session 6:\n\n1. Expand your golden dataset to 20 rows.\n2. Mark the 5 rows that would block launch if they fail.\n3. Add your eval plan to the portfolio packet.\n\n"},{"file":"Week 06 - Working with AI ML Engineering Teams/W06_Facilitator_Script.md","title":"Facilitator Script - Working with AI/ML Engineering Teams (Session 6 of 8)","body":"# Facilitator Script - Working with AI/ML Engineering Teams (Session 6 of 8)\n\n**Subtitle:** Become technically credible without pretending to be the engineer.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** Technical Fluency -> Architecture Review -> Tradeoff Questions -> Brief Defense.  \n**Hands-on share:** ~45% (about 54 minutes).  \n**Session artifact:** Technical Architecture Brief for PMs.  \n**Tools assumed available:** AI PRD, eval plan, workflow map, model/vendor comparison examples.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Prepare architecture review checklist.\n- [ ] Prepare model/vendor comparison table.\n- [ ] Prepare example engineering questions.\n- [ ] Pick 2 learner capstones for live architecture critique if available.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"The goal is not to sound like an ML engineer. The goal is to be the PM engineering trusts in ambiguous technical decisions.\"\n\nAsk chat: \"What technical question do you wish you could ask more confidently?\"\n\n## Block 1 - Strategy Lens: PM Technical Fluency (0:10-0:35)\n\nTeach what senior PMs must understand:\n\n1. Model capability and limits.\n2. Context and retrieval constraints.\n3. Tool/action boundaries.\n4. Data contracts.\n5. Eval and telemetry contracts.\n6. Cost, latency, privacy, and lock-in tradeoffs.\n\n## Block 2 - Applied Walkthrough: Architecture Review (0:35-0:55)\n\nRun the shared case through an architecture review:\n\n- What context is required?\n- What model class is good enough?\n- What can be cached?\n- What actions require approval?\n- What telemetry is required?\n- What failure would trigger rollback?\n\n## Hard Break (0:55-1:05)\n\nReal break.\n\n## Block 3 - Studio: Learner Architecture Brief (1:05-1:42)\n\nLearners draft and defend:\n\n- system map;\n- model/vendor assumption;\n- context/RAG plan;\n- tool/action plan;\n- telemetry/eval plan;\n- unresolved engineering questions.\n\nPair critique: one learner acts as engineering lead and challenges assumptions.\n\n## Block 4 - Artifact Close (1:42-1:55)\n\nLearners finalize 5 engineering questions they would bring to an architecture review.\n\nQuality bar:\n\n- no vague \"is this feasible?\" questions;\n- questions must identify a tradeoff;\n- questions must connect to quality, risk, cost, or launch.\n\n## Block 5 - Close (1:55-2:00)\n\nAssignment: complete Technical Architecture Brief.\n\nNext: Production Readiness.\n\n---\n\n## Contingencies\n\n**If learners overuse jargon:** ask them to explain it to a CFO or CPO.  \n**If learners under-specify:** force exact context, tool, telemetry, and approval decisions.  \n**If model debate dominates:** redirect to product constraints and eval evidence.\n\n"},{"file":"Week 06 - Working with AI ML Engineering Teams/W06_Learner_Workbook.md","title":"Production AI PM - Session 6 Workbook","body":"# Production AI PM - Session 6 Workbook\n\n## Working with AI/ML Engineering Teams\n\nToday you build the technical fluency to lead an architecture discussion.\n\nBy the end of this 120-minute session, you will have a **Technical Architecture Brief for PMs**.\n\nOne rule for today: **Ask questions that expose tradeoffs, not questions that perform technical confidence.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] AI PRD open.\n- [ ] Eval plan open.\n- [ ] Workflow/autonomy map open.\n- [ ] Portfolio packet open.\n\n---\n\n## Exercise 1: Architecture Brief\n\n| Component | Decision | Open question |\n|---|---|---|\n| User surface | | |\n| Model | | |\n| Prompt/instruction layer | | |\n| Context/RAG | | |\n| Tools/actions | | |\n| Memory | | |\n| Telemetry/evals | | |\n| Human review | | |\n\n---\n\n## Exercise 2: Tradeoff Questions\n\nWrite five engineering-facing questions.\n\n| Area | Weak question | Stronger question |\n|---|---|---|\n| Model | Is this model good? | What eval evidence would justify using a smaller model for this workflow? |\n| RAG | Can we use RAG? | What retrieval failure would most damage user trust, and how will we detect it? |\n| Tools | Can the agent call this API? | What permissions and validation are required before the agent can trigger this action? |\n| Cost | Is this expensive? | What is the cost per successful workflow, and what can we cache or route? |\n| Launch | Is it ready? | Which eval failures block beta, and which can be monitored post-launch? |\n\nYour five questions:\n\n1.\n2.\n3.\n4.\n5.\n\n---\n\n## Exercise 3: Model / Vendor Decision\n\n| Factor | Notes |\n|---|---|\n| Capability needed | |\n| Latency target | |\n| Cost sensitivity | |\n| Privacy requirement | |\n| Integration complexity | |\n| Lock-in risk | |\n| Evaluation evidence needed | |\n\nRecommendation:\n\n---\n\n## Take-Home\n\nBefore Session 7:\n\n1. Complete the Technical Architecture Brief.\n2. Add the top 5 engineering questions.\n3. Mark the assumptions that must be validated before launch.\n\n"},{"file":"Week 07 - Production Readiness Cost Latency Safety and Launch/W07_Facilitator_Script.md","title":"Facilitator Script - Production Readiness: Cost, Latency, Safety, and Launch (Session 7 of 8)","body":"# Facilitator Script - Production Readiness: Cost, Latency, Safety, and Launch (Session 7 of 8)\n\n**Subtitle:** Decide what must be true before an AI product should ship.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** Launch Gates -> Cost/Latency -> Safety/Security -> Red-Team Review.  \n**Hands-on share:** ~50% (about 60 minutes).  \n**Session artifact:** Cost and Latency Model, Risk Register, and Launch Readiness Review.  \n**Tools assumed available:** Portfolio packet, eval plan, architecture brief, spreadsheet.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Prepare production readiness template.\n- [ ] Prepare cost-per-workflow example.\n- [ ] Prepare AI security risk examples.\n- [ ] Prepare red-team prompts for the shared case.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"The difference between an AI demo and an AI product is not the UI. It is what happens when the system is expensive, slow, wrong, attacked, or used by real customers.\"\n\nAsk chat: \"Which production risk worries you most: cost, latency, hallucination, security, privacy, or user overtrust?\"\n\n## Block 1 - Strategy Lens: Launch Gates (0:10-0:35)\n\nTeach five gates:\n\n1. Quality gate: eval pass/fail threshold.\n2. Cost gate: cost per successful workflow.\n3. Latency gate: acceptable wait by user context.\n4. Safety/security gate: permissions, injection, data leakage, excessive agency.\n5. Ops gate: monitoring, rollback, escalation, support ownership.\n\n## Block 2 - Applied Walkthrough: Shared Case Readiness (0:35-0:55)\n\nCustomer Success Copilot:\n\n- Cost: model calls per account review.\n- Latency: background account prep vs live response.\n- Security: tenant isolation and CRM permissions.\n- Safety: no external email without approval.\n- Observability: trace failed recommendations and escalation misses.\n\n## Hard Break (0:55-1:05)\n\nReal break.\n\n## Block 3 - Studio: Red-Team Learner Capstones (1:05-1:40)\n\nLearners exchange capstones and attack them:\n\n- Prompt injection.\n- Wrong data access.\n- Unsafe action.\n- High-cost loop.\n- Bad recommendation.\n- Missing escalation.\n\nEach learner records top 5 risks.\n\n## Block 4 - Artifact Build: Launch Readiness Review (1:40-1:55)\n\nLearners complete:\n\n- cost driver;\n- latency target;\n- risk register;\n- beta gate;\n- rollback trigger;\n- monitoring plan.\n\n## Block 5 - Close (1:55-2:00)\n\nAssignment: complete Production Readiness Review.\n\nNext: Executive Narrative, Portfolio, and AI PM Interview Readiness.\n\n---\n\n## Contingencies\n\n**If learners treat safety as compliance only:** bring it back to product launch gates.  \n**If learners cannot estimate cost:** use relative cost drivers: number of calls, context size, output size, review effort.  \n**If red-team feels negative:** frame it as the highest-leverage PM behavior before launch.\n\n"},{"file":"Week 07 - Production Readiness Cost Latency Safety and Launch/W07_Learner_Workbook.md","title":"Production AI PM - Session 7 Workbook","body":"# Production AI PM - Session 7 Workbook\n\n## Production Readiness: Cost, Latency, Safety, and Launch\n\nToday you decide what must be true before your AI product should ship.\n\nBy the end of this 120-minute session, you will have a **Cost and Latency Model**, **Risk Register**, and **Launch Readiness Review**.\n\nOne rule for today: **A product is not ready because the demo works. It is ready when the launch gates are clear.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Eval plan open.\n- [ ] Architecture brief open.\n- [ ] Workflow prototype or sketch open.\n- [ ] Spreadsheet open.\n\n---\n\n## Exercise 1: Cost And Latency Model\n\n| Driver | Notes |\n|---|---|\n| Number of model calls per workflow | |\n| Context size | |\n| Output size | |\n| Tool/API calls | |\n| Human review effort | |\n| Expected usage | |\n| Cost per successful workflow | |\n| Latency target | |\n\nOptimization ideas:\n\n- Cache:\n- Route:\n- Compress:\n- Batch/background:\n- Human review changes:\n\n---\n\n## Exercise 2: Risk Register\n\n| Risk | Likelihood | Impact | Mitigation | Launch gate |\n|---|---|---|---|---|\n| Prompt injection | | | | |\n| Sensitive data leakage | | | | |\n| Excessive agency | | | | |\n| Wrong recommendation | | | | |\n| High-cost loop | | | | |\n| Missing escalation | | | | |\n\n---\n\n## Exercise 3: Launch Readiness Review\n\n### Beta criteria\n\n### GA criteria\n\n### Rollback trigger\n\n### Monitoring plan\n\n### Human escalation plan\n\n### Post-launch learning loop\n\n---\n\n## Red-Team Notes\n\n| Attack / failure | What broke? | Fix before launch? |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n---\n\n## Take-Home\n\nBefore Session 8:\n\n1. Complete your Launch Readiness Review.\n2. Choose the 3 most important portfolio artifacts to polish.\n3. Draft a 2-minute executive story for your capstone.\n\n"},{"file":"Week 08 - Executive Narrative Portfolio and AI PM Interview Readiness/W08_Facilitator_Script.md","title":"Facilitator Script - Executive Narrative, Portfolio, and AI PM Interview Readiness (Session 8 of 8)","body":"# Facilitator Script - Executive Narrative, Portfolio, and AI PM Interview Readiness (Session 8 of 8)\n\n**Subtitle:** Turn the portfolio into a credible senior AI PM signal.  \n**Duration:** 120 minutes. **Format:** Live virtual. **Audience:** Senior PMs and product leaders.  \n**Spine:** Portfolio Bar -> Executive Narrative -> Interview Story -> Final Critique.  \n**Hands-on share:** ~55% (about 66 minutes).  \n**Session artifact:** Final Senior AI PM Portfolio Packet and AI PM Interview Narrative.  \n**Tools assumed available:** Final portfolio packet, learner artifacts, optional public/private portfolio page.\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Ask learners to submit portfolio packet before class if possible.\n- [ ] Select 2-3 artifacts for anonymized live critique.\n- [ ] Prepare executive narrative example.\n- [ ] Prepare AI PM interview prompt set.\n\n---\n\n# The 120-Minute Blended Run Sheet\n\n## Block 0 - Opening (0:00-0:10)\n\n**Say:** \"The portfolio is not a folder of classwork. It is evidence that you can lead an AI product through ambiguity.\"\n\nAsk chat: \"What do you most want this portfolio to prove?\"\n\n## Block 1 - Strategy Lens: The Senior AI PM Story (0:10-0:30)\n\nTeach the narrative spine:\n\n1. Business problem.\n2. Why AI / why now.\n3. Product strategy.\n4. System design.\n5. Evals and quality bar.\n6. Production risk.\n7. Leadership tradeoffs.\n\n## Block 2 - Applied Walkthrough: Board Memo And Interview Story (0:30-0:55)\n\nShow the same capstone framed two ways:\n\n- Executive version: concise, outcome and risk focused.\n- Interview version: judgment, tradeoffs, engineering collaboration, evals.\n\nContrast weak vs strong storytelling:\n\n- Weak: \"I built an AI agent.\"\n- Strong: \"I identified a workflow where AI could reduce account review time, designed the approval-gated system, defined evals, and set launch gates for cost, risk, and quality.\"\n\n## Hard Break (0:55-1:05)\n\nReal break.\n\n## Block 3 - Studio: Portfolio Critique (1:05-1:38)\n\nLearners review each other's packet:\n\n- What proves senior judgment?\n- What sounds like tool usage?\n- What artifact is strongest?\n- What artifact needs evidence?\n- What should be public, private, or anonymized?\n\nReview 2 examples live.\n\n## Block 4 - Interview Narrative Rehearsal (1:38-1:55)\n\nLearners practice a 2-minute version:\n\n1. Problem.\n2. Strategy.\n3. System.\n4. Evals.\n5. Launch risk.\n6. Leadership.\n\nPeer gives one improvement.\n\n## Block 5 - Close (1:55-2:00)\n\nFinal instruction:\n\n- Complete final portfolio packet.\n- Decide public/private/anonymized version.\n- Use optional premium add-ons if purchased: 1:1 review, mock interview, resume/LinkedIn/portfolio review.\n\n---\n\n## Contingencies\n\n**If portfolios are incomplete:** focus on the story and next 7-day polish plan.  \n**If learners overemphasize tools:** ask what judgment the tool use proves.  \n**If learners are nervous about public artifacts:** help them create anonymized versions.\n\n"},{"file":"Week 08 - Executive Narrative Portfolio and AI PM Interview Readiness/W08_Learner_Workbook.md","title":"Production AI PM - Session 8 Workbook","body":"# Production AI PM - Session 8 Workbook\n\n## Executive Narrative, Portfolio, and AI PM Interview Readiness\n\nToday you turn your artifacts into a credible senior AI PM signal.\n\nBy the end of this 120-minute session, you will have a **Final Senior AI PM Portfolio Packet** and **AI PM Interview Narrative**.\n\nOne rule for today: **Do not describe tools. Explain judgment, tradeoffs, and leadership.**\n\n---\n\n## Pre-Class Checklist\n\n- [ ] Strategy memo open.\n- [ ] AI PRD open.\n- [ ] Workflow prototype or sketch open.\n- [ ] Eval plan open.\n- [ ] Architecture brief open.\n- [ ] Launch readiness review open.\n\n---\n\n## Exercise 1: Portfolio Audit\n\n| Artifact | Strong enough? | What to improve |\n|---|---|---|\n| Strategy memo | | |\n| AI PRD | | |\n| Prototype/workflow | | |\n| Eval dataset/rubric | | |\n| Architecture brief | | |\n| Launch readiness review | | |\n| Executive narrative | | |\n\n---\n\n## Exercise 2: Executive Narrative\n\nWrite a 2-minute version.\n\n### Business problem\n\n### Why AI / why now\n\n### Product strategy\n\n### System design\n\n### Eval and quality bar\n\n### Launch risk\n\n### Leadership tradeoff\n\n---\n\n## Exercise 3: Interview Narrative\n\nUse this structure:\n\n1. Situation:\n2. Product judgment:\n3. Technical tradeoff:\n4. Eval and quality bar:\n5. Launch risk:\n6. Cross-functional leadership:\n7. Result or expected result:\n\n---\n\n## Exercise 4: Public / Private / Anonymized\n\n| Artifact | Public | Private | Anonymized | Notes |\n|---|---|---|---|---|\n| Strategy memo | | | | |\n| AI PRD | | | | |\n| Prototype | | | | |\n| Eval dataset | | | | |\n| Architecture brief | | | | |\n| Launch review | | | | |\n\n---\n\n## Final 7-Day Polish Plan\n\n| Day | Action |\n|---|---|\n| Day 1 | |\n| Day 2 | |\n| Day 3 | |\n| Day 4 | |\n| Day 5 | |\n| Day 6 | |\n| Day 7 | |\n\n---\n\n## Optional Premium Add-Ons\n\nUse these if included in your cohort tier:\n\n- 1:1 capstone review.\n- Mock AI PM interview.\n- Resume, LinkedIn, and portfolio positioning review.\n\n"},{"file":"README.md","title":"Production AI PM Program","body":"# Production AI PM Program\n\n## Lead GenAI and Agentic Products from Strategy to Launch\n\nThis folder contains the full program package for **Production AI PM**, a premium cohort program for senior PMs who want to lead GenAI and agentic products with credible product, technical, and launch judgment.\n\nThe program is designed for senior PMs targeting global or remote AI PM roles, and for product leaders who need to work effectively with AI/ML engineering teams.\n\n---\n\n## Program Promise\n\nBy the end, learners will be able to lead an AI product from strategy to production:\n\n- choose AI opportunities worth pursuing;\n- write an AI PRD with behavior, failure modes, and eval criteria;\n- design a GenAI or agentic workflow with engineering;\n- build or direct a low-code prototype;\n- create a golden dataset and eval rubric;\n- reason about cost, latency, safety, security, and launch readiness;\n- present a senior AI PM portfolio and interview narrative.\n\n---\n\n## Format\n\n- **Duration:** 8 weeks.\n- **Live session:** 120 minutes per week.\n- **Session style:** blended strategy + studio / critique.\n- **Assignment load:** 2 to 4 hours per week.\n- **Optional advanced lab:** 60 to 90 minutes for learners who want more technical depth.\n- **Recommended cohort size:** 12 to 18 learners.\n\n---\n\n## Weekly Structure\n\n| Week | Session | Portfolio artifact |\n|---|---|---|\n| 1 | AI Product Judgment for Senior PMs | AI Opportunity One-Pager |\n| 2 | AI Strategy, Moats, and Business Case | AI Product Strategy Memo v1 |\n| 3 | GenAI System Design for PMs | AI PRD v1 |\n| 4 | Agentic Product Design | Agent/RAG Workflow Prototype v1 + Autonomy Map |\n| 5 | Evals as the New PRD | Eval Dataset + Rubric + Failure Taxonomy |\n| 6 | Working with AI/ML Engineering Teams | Technical Architecture Brief |\n| 7 | Production Readiness: Cost, Latency, Safety, and Launch | Risk Register + Launch Readiness Review |\n| 8 | Executive Narrative, Portfolio, and AI PM Interview Readiness | Final Portfolio Packet + Interview Narrative |\n\n---\n\n## Folder Map\n\n| File or folder | Purpose |\n|---|---|\n| `index.html` | Local clickable navigator for all course-level docs and weekly materials |\n| `md-viewer.html` | Local Markdown viewer used by the navigator for `.md` files |\n| `00_Master_Index.md` | Complete package map and recommended setup order |\n| `00_Cohort_Operating_Plan.md` | How to run the cohort week by week |\n| `00_Learner_Handbook.md` | Learner-facing guide to the cohort, artifacts, critique, confidentiality, and portfolio expectations |\n| `00_Instructor_Delivery_Playbook.md` | Instructor/TA guide for live delivery, critique, and session operations |\n| `00_Portfolio_Packet_Template.md` | Final portfolio structure learners fill through the program |\n| `00_Tool_Stack_and_Setup.md` | Required and optional tools |\n| `00_Advanced_Technical_Companion.md` | Opti
