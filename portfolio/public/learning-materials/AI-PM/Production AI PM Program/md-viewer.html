<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production AI PM Markdown Viewer</title>
  <style>
    :root {
      --ink: #191714;
      --muted: #68635b;
      --paper: #f7f4ee;
      --panel: #fffdf8;
      --line: #ddd6ca;
      --accent: #b8431b;
      --accent-dark: #7f2d14;
      --cool: #266170;
      --soft: #f0e8dc;
      --code: #27211d;
      --code-bg: #f1e8da;
      --highlight: #ffe27a;
      --highlight-border: #d49b18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    .shell {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fffaf2;
      padding: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand a {
      color: var(--accent-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    .kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .brand-title {
      font-weight: 850;
      font-size: 20px;
      line-height: 1.1;
    }
    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      background: white;
      color: var(--ink);
      font: inherit;
      margin-bottom: 14px;
    }
    .doc-list {
      display: grid;
      gap: 7px;
    }
    .doc-link {
      display: block;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 10px 11px;
      color: var(--ink);
      text-decoration: none;
      background: transparent;
    }
    .doc-link:hover {
      border-color: var(--line);
      background: white;
    }
    .doc-link.active {
      border-color: var(--accent);
      background: white;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .doc-title {
      display: block;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
    }
    .doc-path {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    main {
      min-width: 0;
      padding: 28px clamp(22px, 3.5vw, 56px) 72px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .topbar a {
      color: var(--accent-dark);
      font-weight: 800;
      text-decoration: none;
    }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .highlight-status {
      color: var(--muted);
      font-size: 12px;
    }
    .highlight-nav {
      display: inline-flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
    }
    .top-button,
    .floating-action,
    .menu-button,
    .panel-button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .top-button {
      padding: 7px 10px;
    }
    .nav-button {
      width: 34px;
      height: 32px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }
    .nav-button:last-child {
      border-right: 0;
    }
    .top-button:hover,
    .nav-button:hover,
    .floating-action:hover,
    .menu-button:hover,
    .panel-button:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }
    .top-button:disabled,
    .nav-button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }
    .article {
      max-width: 1320px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: clamp(24px, 5vw, 56px);
      box-shadow: 0 18px 60px rgba(70, 53, 34, .08);
    }
    .article h1 {
      margin: 0 0 22px;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      letter-spacing: 0;
    }
    .article h2 {
      margin: 38px 0 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 25px;
      line-height: 1.15;
    }
    .article h3 {
      margin: 28px 0 10px;
      color: var(--cool);
      font-size: 19px;
      line-height: 1.2;
    }
    .article h4 {
      margin: 22px 0 8px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .article p { margin: 12px 0; }
    .article a { color: var(--accent-dark); font-weight: 750; }
    .article mark.md-highlight {
      background: linear-gradient(180deg, transparent 12%, var(--highlight) 12%, var(--highlight) 88%, transparent 88%);
      border-bottom: 2px solid var(--highlight-border);
      color: inherit;
      cursor: pointer;
      padding: 0 1px;
    }
    .article mark.md-highlight:hover {
      background: var(--highlight);
    }
    .article mark.md-highlight.active {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      background: var(--highlight);
    }
    .article mark.md-highlight.has-comment {
      border-bottom-style: double;
    }
    .article ul, .article ol {
      padding-left: 24px;
      margin: 12px 0 18px;
    }
    .article li { margin: 5px 0; }
    .article blockquote {
      margin: 20px 0;
      padding: 14px 18px;
      border-left: 4px solid var(--accent);
      background: var(--soft);
      color: var(--ink);
    }
    .article code {
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--code-bg);
      color: var(--code);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: .92em;
    }
    .article pre {
      overflow: auto;
      margin: 18px 0;
      padding: 16px;
      border-radius: 7px;
      background: var(--code);
      color: #fffaf2;
      line-height: 1.5;
    }
    .article pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }
    .table-wrap {
      overflow-x: auto;
      margin: 16px 0 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--soft);
      color: var(--accent-dark);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    tr:last-child td { border-bottom: 0; }
    .empty {
      padding: 40px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: white;
    }
    .floating-action {
      position: fixed;
      z-index: 20;
      display: none;
      padding: 8px 10px;
      box-shadow: 0 12px 32px rgba(25, 23, 20, .16);
    }
    .floating-menu,
    .comment-panel {
      position: fixed;
      z-index: 25;
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      box-shadow: 0 18px 48px rgba(25, 23, 20, .18);
    }
    .floating-menu {
      gap: 6px;
      padding: 7px;
    }
    .menu-button {
      padding: 8px 10px;
    }
    .comment-panel {
      width: min(360px, calc(100vw - 24px));
      padding: 12px;
    }
    .comment-panel label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .comment-panel textarea {
      width: 100%;
      min-height: 108px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }
    .comment-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }
    .panel-button {
      padding: 8px 10px;
    }
    .floating-action.is-visible {
      display: block;
    }
    .floating-menu.is-visible {
      display: inline-flex;
    }
    .comment-panel.is-visible {
      display: block;
    }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      aside {
        position: relative;
        height: auto;
        max-height: 45vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main { padding: 22px 16px 40px; }
      .article { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div>
          <div class="kicker">Production AI PM</div>
          <div class="brand-title">Markdown Viewer</div>
        </div>
        <a href="index.html">Index</a>
      </div>
      <input id="search" class="search" type="search" placeholder="Search docs">
      <nav id="docList" class="doc-list" aria-label="Markdown files"></nav>
    </aside>
    <main>
      <div class="topbar">
        <span id="pathLabel">Select a document</span>
        <div class="top-actions">
          <span id="highlightStatus" class="highlight-status">No highlights</span>
          <div class="highlight-nav" aria-label="Highlight navigation">
            <button id="highlightPrev" class="nav-button" type="button" title="Previous highlight" disabled>↑</button>
            <button id="highlightNext" class="nav-button" type="button" title="Next highlight" disabled>↓</button>
          </div>
          <button id="clearHighlights" class="top-button" type="button" disabled>Clear highlights</button>
          <a id="rawLink" href="#" target="_blank" rel="noreferrer">Open raw file</a>
        </div>
      </div>
      <article id="article" class="article">
        <div class="empty">Choose a Markdown file from the sidebar.</div>
      </article>
    </main>
  </div>
  <button id="highlightAction" class="floating-action" type="button">Highlight</button>
  <div id="highlightMenu" class="floating-menu" role="menu" aria-label="Highlight actions">
    <button id="selectHighlightAction" class="menu-button" type="button">Select</button>
    <button id="commentHighlightAction" class="menu-button" type="button">Comment</button>
    <button id="deleteHighlightAction" class="menu-button" type="button">Delete</button>
  </div>
  <div id="highlightCommentPanel" class="comment-panel" aria-label="Highlight comment">
    <label for="highlightCommentText">Comment</label>
    <textarea id="highlightCommentText" placeholder="Add a note for this highlight"></textarea>
    <div class="comment-actions">
      <button id="cancelHighlightComment" class="panel-button" type="button">Cancel</button>
      <button id="saveHighlightComment" class="panel-button" type="button">Save comment</button>
    </div>
  </div>

  <script id="doc-data" type="application/json">[{"file":"00_Master_Index.md","title":"Production AI PM Master Index","body":"# Production AI PM Master Index\n\n## What This Package Contains\n\nThis is the complete operating package for the Production AI PM cohort.\n\nIt includes:\n\n- program positioning and structure;\n- learner handbook;\n- instructor delivery playbook;\n- tool setup and advanced technical companion;\n- weekly facilitator scripts;\n- weekly learner workbooks;\n- synced presenter and learner HTML decks;\n- capstone casebook;\n- assessment rubrics and certification criteria;\n- prompt and workflow library;\n- onboarding and communication templates;\n- portfolio and career kit;\n- marketing and landing page copy;\n- premium add-on playbook;\n- QA checklist and cohort tracker.\n\nUse this file as the first internal reference when preparing the cohort.\n\n---\n\n## Course-Level Files\n\n| File | Audience | Purpose |\n|---|---|---|\n| `README.md` | Internal | Quick package overview and folder map |\n| `index.html` | Internal / facilitator | Clickable local navigator for docs, decks, and weekly materials |\n| `md-viewer.html` | Internal / facilitator / learners | Local Markdown viewer for course docs |\n| `00_Master_Index.md` | Internal | Complete package map |\n| `00_Cohort_Operating_Plan.md` | Internal | Cohort rhythm, feedback checkpoints, and facilitation principles |\n| `00_Learner_Handbook.md` | Learners | How to move through the program and build the portfolio |\n| `00_Instructor_Delivery_Playbook.md` | Instructor / TA | Run-of-show, live delivery, critique, and session operations |\n| `00_Portfolio_Packet_Template.md` | Learners | Final portfolio artifact structure |\n| `00_Tool_Stack_and_Setup.md` | Learners | Quick-start tool setup |\n| `00_Advanced_Technical_Companion.md` | Advanced learners | Deeper technical guide for AI PM credibility |\n| `00_Capstone_Casebook.md` | Learners / instructor | Capstone tracks, shared case, and example product contexts |\n| `00_Assessment_Rubrics_And_Certification.md` | Instructor / learners | Artifact scoring, completion criteria, and certificate bar |\n| `00_Prompt_And_Workflow_Library.md` | Learners | Reusable prompts, critique prompts, and workflow patterns |\n| `00_Onboarding_Communications_And_Email_Templates.md` | Program ops | Welcome emails, reminders, nudges, and post-session templates |\n| `00_Portfolio_Showcase_And_Career_Kit.md` | Learners | Portfolio packaging, interview story, LinkedIn, and resume translation |\n| `00_Marketing_Landing_Page_And_Positioning.md` | Program owner | Landing page copy, offer, ICP, objections, and proof points |\n| `00_Premium_AddOns_Playbook.md` | Program owner | 1:1 capstone review, mock interviews, portfolio review, and advanced labs |\n| `00_Program_QA_And_Launch_Checklist.md` | Program ops | Pre-launch and delivery QA checklist |\n| `00_Cohort_Tracker.csv` | Program ops | Lightweight tracker for attendance, submissions, feedback, and completion |\n\n---\n\n## Weekly Folder Pattern\n\nEach weekly folder contains:\n\n- `W##_Facilitator_Script.md`\n- `W##_Learner_Workbook.md`\n- `W##_Presenter_Deck.html`\n- `W##_Learner_Deck.html`\n\nThe presenter deck can open and sync with the learner deck for the same week.\n\n---\n\n## Recommended Setup Order\n\n1. Read `00_Master_Index.md`.\n2. Read `00_Cohort_Operating_Plan.md`.\n3. Customize `00_Marketing_Landing_Page_And_Positioning.md`.\n4. Set learner expectations using `00_Learner_Handbook.md`.\n5. Send onboarding messages from `00_Onboarding_Communications_And_Email_Templates.md`.\n6. Prepare the shared capstone case using `00_Capstone_Casebook.md`.\n7. Run Week 1 using `W01_Facilitator_Script.md` and `W01_Presenter_Deck.html`.\n8. Track progress in `00_Cohort_Tracker.csv`.\n9. Score artifacts using `00_Assessment_Rubrics_And_Certification.md`.\n10. Package final learner outcomes using `00_Portfolio_Showcase_And_Career_Kit.md`.\n\n---\n\n## What Is Complete\n\nThe package is complete for a first premium cohort if these are true:\n\n- every weekly folder has a facilitator script, learner workbook, presenter deck, and learner deck;\n- the learner handbook has been sent before Week 1;\n- the tool setup doc has been sent before Week 1;\n- the shared case has been prepared before Week 1;\n- the cohort tracker has learner names and capstone tracks;\n- rubrics are shared before the first submission;\n- premium add-ons are defined before sales calls;\n- the final portfolio packet is introduced in Week 1, not Week 8.\n\n---\n\n## What To Customize Before Launch\n\nCustomize these items before selling or running the cohort:\n\n- cohort start date and schedule;\n- pricing and tier names;\n- cohort size;\n- platform and community channel;\n- tool access instructions;\n- submission mechanism;\n- feedback turnaround time;\n- certificate language;\n- examples from your own public products;\n- privacy policy and terms for learner data.\n\nKeep the curriculum logic stable. Customize the operational details.\n"},{"file":"00_Cohort_Operating_Plan.md","title":"Cohort Operating Plan","body":"# Cohort Operating Plan\n\n## Program Shape\n\n**Production AI PM** runs as an 8-week live cohort program.\n\n- 1 live session per week.\n- 120 minutes per session.\n- Blended strategy + studio / critique format.\n- 2 to 4 hours of learner assignment work per week.\n- Optional 60 to 90 minute advanced lab for technical learners.\n- Recommended cohort size: 12 to 18 learners.\n\n---\n\n## Weekly Session Rhythm\n\nEach 120-minute session uses this default flow:\n\n| Segment | Time | Purpose |\n|---|---:|---|\n| Opening and context | 0:00-0:10 | Set the session promise and connect to portfolio artifact |\n| Strategy lens | 0:10-0:35 | Teach the core judgment model |\n| Applied walkthrough | 0:35-0:55 | Show the framework on the shared case |\n| Break | 0:55-1:05 | Real 10-minute break |\n| Studio / critique | 1:05-1:45 | Learners apply the framework to capstones |\n| Artifact close | 1:45-2:00 | Commit next assignment and review quality bar |\n\nAdjust within 5 minutes as needed, but keep the strategy + studio blend in one session.\n\n---\n\n## Feedback Checkpoints\n\n| Week | Feedback item | Review mode |\n|---|---|---|\n| 2 | AI Product Strategy Memo | Short written review or live critique |\n| 4 | AI PRD + Workflow Prototype | Studio critique |\n| 5 | Eval Dataset + Rubric | Rubric review |\n| 7 | Production Readiness Review | Red-team review |\n| 8 | Final Portfolio Packet | Final critique |\n\n---\n\n## Optional Premium Add-Ons\n\nThese can be sold as a higher-touch tier or offered selectively:\n\n1. **1:1 capstone review**  \n   A private review of the learner's portfolio packet, technical architecture, and launch readiness.\n\n2. **Mock AI PM interview**  \n   A senior AI PM interview simulation focused on product judgment, technical tradeoffs, evals, and stakeholder communication.\n\n3. **Resume, LinkedIn, and portfolio positioning review**  \n   Helps learners turn course artifacts into a credible external career signal.\n\n---\n\n## Pre-Cohort Setup\n\nBefore Week 1:\n\n- Confirm learner profile and goals.\n- Send tool setup instructions.\n- Share the portfolio packet template.\n- Ask learners to bring one real AI product idea from their work or domain.\n- Prepare the shared B2B SaaS case.\n- Prepare fallback capstone prompts for learners who cannot use work context.\n\n---\n\n## Post-Session Workflow\n\nWithin 24 hours after each session:\n\n- Send the session workbook.\n- Send the assignment reminder.\n- Share the recording if applicable.\n- Share any live critique notes.\n- Add unresolved questions to a shared parking lot.\n- Remind learners which portfolio artifact is due next.\n\n---\n\n## Facilitation Principles\n\n- Assume learners already know PM fundamentals.\n- Spend less time defining terms and more time applying judgment.\n- Keep tools subordinate to product decisions.\n- Treat evals, traces, cost, latency, risk, and launch gates as core PM craft.\n- Push learners to make tradeoffs explicit.\n\n"},{"file":"00_Learner_Handbook.md","title":"Production AI PM Learner Handbook","body":"# Production AI PM Learner Handbook\n\n## Program Promise\n\nProduction AI PM is an 8-week cohort for senior PMs and product leaders who want to lead GenAI and agentic products from strategy to launch.\n\nBy the end of the program, you should be able to:\n\n- decide which AI product ideas deserve to be built;\n- explain an AI system clearly enough to work with engineering;\n- design GenAI, RAG, and agentic workflows with appropriate human control;\n- define evals, failure modes, and launch gates;\n- reason about cost, latency, safety, and production readiness;\n- package the work into a credible senior AI PM portfolio and interview story.\n\nThis is not a generic PM basics course, a coding bootcamp, a heavy ML math course, or a prompt-engineering-only workshop.\n\n---\n\n## Who This Is For\n\nThis program is built for:\n\n- senior PMs moving into AI PM, GenAI PM, or agentic product roles;\n- product leaders working with AI/ML engineering teams;\n- PMs targeting global or remote AI PM roles;\n- operators who need portfolio-grade proof of AI product judgment.\n\nYou do not need to code to complete the core path. You do need to make product decisions, write clearly, critique work, and understand technical tradeoffs well enough to lead the room.\n\n---\n\n## How The Course Works\n\nEach week has one 120-minute live session.\n\nThe session is blended:\n\n- strategy lens;\n- applied walkthrough;\n- live studio work;\n- critique;\n- portfolio artifact close.\n\nEach week also has a workbook, a presenter/learner deck pair, and a portfolio artifact. The weekly work compounds into one final Senior AI PM Portfolio Packet.\n\nExpected time:\n\n- live session: 2 hours per week;\n- assignment work: 2 to 4 hours per week;\n- optional advanced technical work: 1 to 2 hours per week.\n\n---\n\n## Your Working Folder\n\nCreate one private folder for the cohort before Week 1.\n\nRecommended structure:\n\n```text\nProduction AI PM Portfolio/\n  01_AI_Product_Strategy_Memo/\n  02_AI_PRD/\n  03_Agent_RAG_Workflow_Prototype/\n  04_Evals_And_Golden_Dataset/\n  05_Technical_Architecture_Brief/\n  06_Production_Readiness_Review/\n  07_Executive_Narrative_And_Interview_Story/\n  Scratch/\n  Private_Data_Do_Not_Share/\n```\n\nKeep public, private, and anonymized material separate from the start. Do not wait until Week 8 to decide what can be shown externally.\n\n---\n\n## Capstone Tracks\n\nChoose one capstone track by the end of Week 1.\n\n| Track | Best for | Example |\n|---|---|---|\n| Enterprise Copilot | B2B SaaS, internal tools, support, sales, success, finance, HR | Customer Success Copilot |\n| Agentic Workflow Product | Multi-step operations, approvals, routing, research, automation | Renewal Risk Agent |\n| Decision Support Product | Recommendations, summarization, personalization, trust, quality | Portfolio Risk Assistant |\n\nIf you cannot use a real work problem, use a synthetic or anonymized product context. A strong anonymized portfolio is better than a vague real one.\n\n---\n\n## Confidentiality Rules\n\nUse good judgment with company, customer, and personal data.\n\nDo:\n\n- anonymize company and customer names when needed;\n- replace real numbers with realistic ranges;\n- use synthetic examples for sensitive workflows;\n- mark anything private at the top of the document;\n- keep confidential artifacts out of public portfolio links.\n\nDo not:\n\n- paste private customer data into AI tools;\n- expose internal architecture, contracts, pricing, or strategy;\n- share production credentials, API keys, recordings, or private documents;\n- publish artifacts that imply endorsement from an employer or client.\n\nFor your final portfolio, every artifact should be labeled as one of:\n\n- public;\n- private;\n- anonymized;\n- interview-only.\n\n---\n\n## Weekly Artifact Map\n\n| Week | Session | Portfolio artifact |\n|---|---|---|\n| 1 | AI Product Judgment for Senior PMs | AI Opportunity One-Pager |\n| 2 | AI Strategy, Moats, and Business Case | AI Product Strategy Memo v1 |\n| 3 | GenAI System Design for PMs | AI PRD v1 |\n| 4 | Agentic Product Design | Agent/RAG Workflow Prototype v1 + Autonomy Map |\n| 5 | Evals as the New PRD | Eval Dataset + Rubric + Failure Mode Taxonomy |\n| 6 | Working with AI/ML Engineering Teams | Technical Architecture Brief for PMs |\n| 7 | Production Readiness: Cost, Latency, Safety, and Launch | Cost Model + Risk Register + Launch Readiness Review |\n| 8 | Executive Narrative, Portfolio, and AI PM Interview Readiness | Final Portfolio Packet + AI PM Interview Narrative |\n\n---\n\n## What Good Work Looks Like\n\nGood work in this cohort is not judged by how many tools you use. It is judged by the quality of your decisions.\n\nStrong artifacts:\n\n- name a specific user and workflow;\n- explain why AI is needed and what the non-AI alternative is;\n- make assumptions visible;\n- include failure modes and quality bars;\n- connect product decisions to system behavior;\n- show how quality will be evaluated;\n- include launch risks, cost, latency, and operational constraints;\n- are concise enough for an executive or interviewer to understand quickly.\n\nWeak artifacts:\n\n- describe a tool demo without a product decision;\n- use generic AI language without workflow detail;\n- avoid risk, failure, and cost;\n- rely on prompts as the whole product;\n- assume the model will be right because the demo looked good.\n\n---\n\n## Critique Norms\n\nThis is a senior-level cohort. Critique should make the work sharper, not safer.\n\nWhen giving critique:\n\n- point to the decision, not the person;\n- name the weakest assumption;\n- ask what would make the idea fail;\n- separate user value, business value, and technical feasibility;\n- suggest one concrete improvement.\n\nWhen receiving critique:\n\n- do not defend too early;\n- write down the risk being exposed;\n- ask what evidence would change the conclusion;\n- decide whether to pursue, reshape, or kill the current version.\n\nUse this simple critique frame:\n\n| Question | Purpose |\n|---|---|\n| What is the strongest part? | Preserve what is working |\n| What is the weakest assumption? | Focus the next validation step |\n| What failure would hurt trust? | Surface production risk |\n| What should be cut or simplified? | Reduce demo-driven scope |\n| What evidence is missing? | Make the next step concrete |\n\n---\n\n## Tool Philosophy\n\nYou will use named tools, but the course is not positioned around any one tool.\n\nThe durable principles are:\n\n- workflow before interface;\n- context before model choice;\n- evals before launch;\n- approval before autonomy;\n- telemetry before scaling;\n- product judgment before prompt polish.\n\nUse tools to make your decisions visible. If a tool changes, the product logic should still hold.\n\n---\n\n## Core Tool Setup\n\nBefore Week 1, make sure you have:\n\n- Claude or ChatGPT;\n- a research tool such as Perplexity;\n- Google Docs, Notion, or equivalent;\n- Google Sheets, Airtable, or equivalent;\n- n8n, Make, Zapier, or a workflow automation equivalent;\n- Figma, FigJam, Miro, or equivalent;\n- a private folder for portfolio artifacts.\n\nThe optional advanced path is covered in `00_Advanced_Technical_Companion.md`.\n\n---\n\n## Weekly Learner Rhythm\n\nBefore each session:\n\n- open the weekly workbook;\n- open your latest portfolio artifact;\n- bring one decision you want critiqued;\n- prepare any required sample inputs, outputs, traces, or eval rows.\n\nDuring the session:\n\n- keep notes inside the artifact, not in a disconnected notebook;\n- use the studio time to make decisions;\n- ask for critique on tradeoffs, not on polish;\n- capture one next action before the session ends.\n\nAfter the session:\n\n- finish the weekly artifact within 48 hours;\n- mark assumptions and open questions;\n- update the final portfolio packet;\n- decide what is public, private, or anonymized;\n- prepare the next artifact before the next live session.\n\n---\n\n## Portfolio Completion Bar\n\nYour final portfolio should include seven pieces.\n\n| Artifact | Completion bar |\n|---|---|\n| Strategy Memo | Clear business outcome, user workflow, AI rationale, moat, and first release |\n| AI PRD | Inputs, context, behavior, failure modes, approvals, and acceptance criteria |\n| Workflow Prototype | Clear workflow steps, tool/data dependencies, autonomy boundaries, and demo scenario |\n| Eval Plan | Golden dataset, failure taxonomy, rubric, and launch-blocking rows |\n| Architecture Brief | Plain-English system map and engineering questions |\n| Launch Review | Cost, latency, risk register, monitoring, beta/GA gates, rollback |\n| Executive Story | Two-minute narrative and interview-ready tradeoff story |\n\nThe final packet does not need to be long. It needs to be specific.\n\n---\n\n## AI Use Policy\n\nUse AI tools to accelerate thinking, drafting, critique, and prototyping. Do not use them to hide weak judgment.\n\nAcceptable uses:\n\n- turn rough notes into a structured memo;\n- generate alternative failure modes;\n- critique an eval rubric;\n- draft synthetic examples;\n- compare architecture options;\n- rehearse interview answers.\n\nUnacceptable uses:\n\n- fabricating evidence;\n- claiming a tool demo is production-ready;\n- using private data in tools that are not approved for that data;\n- submitting generic AI-written artifacts without product-specific judgment.\n\nWhen in doubt, note how AI was used in the artifact footer.\n\n---\n\n## Feedback Checkpoints\n\nYou will get the most value from the program if you submit work before these points.\n\n| Week | Feedback item | What to bring |\n|---|---|---|\n| 2 | Strategy Memo | One-pager plus target user, workflow, and business outcome |\n| 4 | AI PRD + Workflow Prototype | System map, behavior spec, and autonomy map |\n| 5 | Eval Dataset + Rubric | At least 10 rows and a first failure taxonomy |\n| 7 | Production Readiness Review | Cost/latency model, risk register, beta/GA criteria |\n| 8 | Final Portfolio Packet | Public/private/anonymized version plus interview story |\n\n---\n\n## Optional Premium Add-Ons\n\nThe program can include higher-touch support depending on the cohort tier.\n\nPossible add-ons:\n\n- 1:1 capstone review;\n- mock AI PM interview;\n- resume, LinkedIn, and portfolio positioning review;\n- advanced technical lab review;\n- public portfolio polish.\n\nUse these for high-leverage feedback, not for redoing basic assignment work.\n\n---\n\n## Final Week Readiness Checklist\n\nBefore the final session, confirm:\n\n- [ ] The portfolio packet has all seven sections.\n- [ ] Each artifact has a clear title and one-line purpose.\n- [ ] Sensitive material is labeled public, private, anonymized, or interview-only.\n- [ ] The AI PRD has failure modes and acceptance criteria.\n- [ ] The eval plan has at least 20 golden dataset rows.\n- [ ] The launch review has beta criteria, GA criteria, and rollback triggers.\n- [ ] The executive story can be delivered in 2 minutes.\n- [ ] The interview story explains judgment, tradeoffs, and leadership.\n\n---\n\n## The Standard\n\nBy the end, your work should make this claim credible:\n\n> I can lead a GenAI or agentic product from opportunity selection through system design, evals, engineering tradeoffs, launch readiness, and executive communication.\n\nThat is the bar. Every artifact should help prove it.\n"},{"file":"00_Instructor_Delivery_Playbook.md","title":"Instructor Delivery Playbook","body":"# Instructor Delivery Playbook\n\n## Purpose\n\nThis playbook is for the instructor, TA, or program operator running Production AI PM.\n\nIt explains how to deliver the cohort, manage critique, run the synced decks, keep learners on track, and protect the premium experience.\n\n---\n\n## Delivery Principles\n\n- Treat learners as senior operators, not beginners.\n- Spend more time on judgment than definitions.\n- Use tools as evidence of product thinking, not as the headline.\n- Make tradeoffs explicit.\n- Critique artifacts, not personalities.\n- Keep the weekly artifact tied to the final portfolio.\n- Protect the 120-minute session shape.\n- Never let a tool demo replace evals, risk, cost, or launch readiness.\n\n---\n\n## Standard 120-Minute Session Shape\n\n| Time | Segment | Instructor job |\n|---|---|---|\n| 0:00-0:10 | Opening and context | Re-anchor the artifact and one rule |\n| 0:10-0:35 | Strategy lens | Teach the core judgment model |\n| 0:35-0:55 | Applied walkthrough | Show the model on the shared case |\n| 0:55-1:05 | Break | Protect the break |\n| 1:05-1:30 | Studio | Learners apply the model to capstones |\n| 1:30-1:45 | Critique | Pressure-test 2 to 3 artifacts |\n| 1:45-1:55 | Artifact close | Explain the assignment and quality bar |\n| 1:55-2:00 | Close | Capture next action and preview next week |\n\nIf running late, shorten lecture. Do not cut critique, break, or artifact close.\n\n---\n\n## Pre-Session Checklist\n\nComplete this 24 hours before each session.\n\n- [ ] Review the facilitator script.\n- [ ] Open the presenter deck.\n- [ ] Open the learner deck once to confirm it loads.\n- [ ] Open the learner workbook.\n- [ ] Open the portfolio packet template.\n- [ ] Prepare the shared case example.\n- [ ] Prepare one strong and one weak example artifact.\n- [ ] Review submissions due for critique.\n- [ ] Choose 2 to 3 learner artifacts for live critique.\n- [ ] Prepare the post-session message.\n- [ ] Confirm recording and chat settings.\n\n---\n\n## How To Use The Synced Decks\n\nEach week has two HTML decks:\n\n- `W##_Presenter_Deck.html`\n- `W##_Learner_Deck.html`\n\nUse the presenter deck for facilitation notes and controls. Use the learner deck for the clean participant view.\n\nRecommended setup:\n\n1. Open the presenter deck.\n2. Click `Learner Deck`.\n3. Share the learner deck window on Zoom or Meet.\n4. Keep the presenter deck visible only to the instructor.\n5. Advance slides from the presenter deck.\n6. Confirm the learner deck follows.\n\nIf sync fails:\n\n- refresh the learner deck;\n- move both decks back to slide 1;\n- use keyboard arrows in the shared learner deck as fallback.\n\n---\n\n## Studio Facilitation Pattern\n\nUse the same pattern every week.\n\n1. Set the artifact decision.\n2. Give 6 to 8 minutes of solo work.\n3. Move to pair or small-group critique.\n4. Bring back 2 to 3 examples.\n5. Ask the room to identify the weakest assumption.\n6. Convert critique into the take-home assignment.\n\nDo not ask, \"Any thoughts?\" Ask precise critique questions:\n\n- What is the strongest decision here?\n- What is the weakest assumption?\n- What would make this unsafe to launch?\n- What data or context is missing?\n- What should be cut from scope?\n\n---\n\n## Live Critique Rubric\n\nUse this quick rubric during class.\n\n| Dimension | What to listen for |\n|---|---|\n| Specificity | Named user, workflow, decision, and context |\n| AI necessity | Clear reason AI is better than non-AI alternatives |\n| Technical realism | System behavior, data, retrieval, tools, approvals |\n| Quality bar | Concrete evals, failure modes, and launch gates |\n| Production judgment | Cost, latency, privacy, safety, operations |\n| Executive clarity | Can the learner explain the tradeoff in 2 minutes? |\n\n---\n\n## Handling Common Session Problems\n\n### Learner Has A Weak Capstone\n\nAsk:\n\n- What workflow is actually painful?\n- What decision is high-frequency or high-stakes?\n- What would the non-AI version be?\n- What evidence would make you kill this?\n\nIf still weak, move them to the shared Customer Success Copilot case for one week.\n\n### Learner Wants To Build A Generic Chatbot\n\nRedirect to workflow:\n\n- Who uses it?\n- During what task?\n- What context does it need?\n- What action does it support?\n- What failure would damage trust?\n\n### Learner Is Too Tool-Focused\n\nAsk:\n\n- What product decision does this tool output support?\n- What would be true if the tool disappeared tomorrow?\n- What eval would prove this is better than manual work?\n\n### Learner Is Too Strategy-Only\n\nAsk:\n\n- What would the system actually do?\n- What data is needed?\n- What would engineering need to build first?\n- What trace would you inspect?\n\n### Learner Shares Sensitive Work Data\n\nPause and reset:\n\n- ask them to anonymize;\n- replace names and exact values;\n- move sensitive details to a private artifact;\n- remind the cohort of the confidentiality rules.\n\n---\n\n## Feedback Workflow\n\nUse the feedback checkpoints in Weeks 2, 4, 5, 7, and 8.\n\nRecommended feedback format:\n\n```text\nArtifact:\nCurrent level:\nStrongest signal:\nWeakest assumption:\nProduction risk:\nOne improvement before next review:\n```\n\nKeep feedback short and decision-oriented. Do not rewrite the learner's work.\n\n---\n\n## TA Role\n\nIf using a TA, assign these responsibilities:\n\n- monitor chat;\n- collect questions in a parking lot;\n- track attendance;\n- note who shared artifacts;\n- capture critique decisions;\n- drop workbook and resource links;\n- flag learners who are falling behind;\n- prepare submission summaries for the instructor.\n\nThe TA should not answer strategic questions that need instructor judgment. They should triage and organize them.\n\n---\n\n## After-Session Checklist\n\nWithin 24 hours:\n\n- [ ] Send recording, if applicable.\n- [ ] Send learner workbook link.\n- [ ] Send assignment reminder.\n- [ ] Share critique notes.\n- [ ] Update cohort tracker.\n- [ ] Mark missing submissions.\n- [ ] Add unresolved questions to the parking lot.\n- [ ] Remind learners of the next artifact.\n\n---\n\n## Premium Experience Bar\n\nThe cohort feels premium when:\n\n- learners know what to prepare before each session;\n- live time is used for judgment and critique;\n- artifacts compound into the portfolio;\n- feedback is specific and fast;\n- tools are practical but not gimmicky;\n- the instructor can handle technical questions with clarity;\n- learners leave each week with a decision, not just notes.\n\nThat is the delivery standard.\n"},{"file":"00_Portfolio_Packet_Template.md","title":"Senior AI PM Portfolio Packet Template","body":"# Senior AI PM Portfolio Packet Template\n\nUse this as the final learner deliverable. Each section should be concise enough for an interviewer or executive to review, but specific enough to show real product judgment.\n\n---\n\n## 1. AI Product Strategy Memo\n\n### Product concept\n\n- Product / feature name:\n- Target user:\n- Workflow or decision being improved:\n- Current pain:\n- Why AI is relevant:\n- Why now:\n\n### Opportunity filter\n\n| Question | Answer |\n|---|---|\n| Is the pain frequent or high-stakes? | |\n| Does AI improve the workflow meaningfully? | |\n| What data/context is available? | |\n| What quality bar must be met? | |\n| What happens when the system is wrong? | |\n| What non-AI alternative exists? | |\n\n### Strategy\n\n- Business outcome:\n- User outcome:\n- Data or workflow advantage:\n- Distribution advantage:\n- Build / buy / partner recommendation:\n- 90-day roadmap:\n\n---\n\n## 2. AI PRD\n\n### User journey\n\n- Trigger:\n- User goal:\n- AI system role:\n- Human role:\n- Success state:\n- Failure state:\n\n### System behavior\n\n- Inputs:\n- Context needed:\n- Retrieval sources:\n- Tools/actions:\n- Output format:\n- Human approval points:\n\n### Failure modes\n\n| Failure mode | User impact | Detection method | Mitigation |\n|---|---|---|---|\n| | | | |\n| | | | |\n| | | | |\n\n### Acceptance criteria\n\n- Must do:\n- Must not do:\n- Escalates when:\n- Refuses when:\n- Logs when:\n\n---\n\n## 3. Agent/RAG Workflow Prototype\n\n### Prototype summary\n\n- Tool used:\n- Workflow steps:\n- Data/context sources:\n- Human approval gates:\n- Demo scenario:\n\n### Autonomy map\n\n| Step | AI role | Human role | Tool/data used | Approval needed? |\n|---|---|---|---|---|\n| | | | | |\n| | | | | |\n| | | | | |\n\n---\n\n## 4. Eval Plan And Golden Dataset\n\n### Quality goal\n\n- What good looks like:\n- What bad looks like:\n- What must be measured before launch:\n\n### Golden dataset\n\n| ID | Input | Context | Expected behavior | Failure category | Severity |\n|---|---|---|---|---|---|\n| 001 | | | | | |\n| 002 | | | | | |\n| 003 | | | | | |\n\n### Eval rubric\n\n| Criterion | Pass | Fail |\n|---|---|---|\n| Groundedness | | |\n| Task completion | | |\n| Safety / permissions | | |\n| Tone / UX | | |\n| Escalation behavior | | |\n\n---\n\n## 5. Technical Architecture Brief For PMs\n\n### Plain-English architecture\n\n- User surface:\n- Model:\n- Prompt / instruction layer:\n- Context and RAG:\n- Tools and APIs:\n- Memory:\n- Telemetry:\n- Human review:\n\n### Engineering questions to resolve\n\n1.\n2.\n3.\n4.\n5.\n\n---\n\n## 6. Production Readiness Review\n\n### Cost and latency\n\n- Cost driver:\n- Expected usage:\n- Cost per workflow:\n- Latency target:\n- Optimization levers:\n\n### Risk register\n\n| Risk | Likelihood | Impact | Mitigation | Launch gate |\n|---|---|---|---|---|\n| | | | | |\n| | | | | |\n| | | | | |\n\n### Launch plan\n\n- Alpha:\n- Beta:\n- GA criteria:\n- Rollback trigger:\n- Monitoring plan:\n- Post-launch learning loop:\n\n---\n\n## 7. Executive Narrative And Interview Story\n\n### Executive version\n\nIn 2 minutes, explain:\n\n- the business problem;\n- why AI is the right approach;\n- what system you would build;\n- how you would evaluate quality;\n- what risks you would control;\n- what you would ship first.\n\n### Interview version\n\nUse this structure:\n\n1. Situation:\n2. Product judgment:\n3. Technical tradeoff:\n4. Eval and quality bar:\n5. Launch risk:\n6. Cross-functional leadership:\n7. Result or expected result:\n\n"},{"file":"00_Tool_Stack_and_Setup.md","title":"Tool Stack And Setup","body":"# Tool Stack And Setup\n\nThe course teaches named tools deeply enough to be practical, but every tool is framed through durable PM principles: workflow modeling, context design, evals, cost, risk, and launch readiness.\n\n---\n\n## Core Path: No-Code / Low-Code\n\nLearners should have access to:\n\n- **Claude or ChatGPT** for product reasoning, structured outputs, system prompts, critique, and PRD drafting.\n- **Perplexity or equivalent research tool** for source-backed market and competitor research.\n- **Google Docs or Notion** for portfolio packet artifacts.\n- **Google Sheets or Airtable** for golden datasets, eval tables, scoring rubrics, and simple cost models.\n- **n8n** for workflow automation, tool calls, approvals, and agent demos.\n- **Lovable, v0, Bolt, or equivalent** for lightweight UI prototyping.\n- **Figma or FigJam** for flow maps, autonomy maps, system diagrams, and approval paths.\n\n---\n\n## Optional Advanced Path\n\nFor learners who want deeper technical credibility:\n\n- OpenAI or Anthropic API access.\n- Claude Code, Codex, Cursor, or similar AI coding environment.\n- GitHub for private or public portfolio artifacts.\n- LangSmith, Braintrust, Humanloop, or Langfuse for traces and evals.\n- A hosted vector/RAG tool or lightweight framework.\n- PostHog, Amplitude, or equivalent product analytics tool.\n\nUse `00_Advanced_Technical_Companion.md` for the deeper optional path: system architecture, RAG, agents, evals, tracing, cost, latency, safety, and engineering review questions.\n\n---\n\n## Learner Setup Checklist\n\nBefore Week 1:\n\n- [ ] Create or confirm access to Claude or ChatGPT.\n- [ ] Create or confirm access to a research tool.\n- [ ] Create a folder for portfolio docs.\n- [ ] Create a spreadsheet for eval datasets.\n- [ ] Create or confirm access to n8n.\n- [ ] Create or confirm access to a no-code prototype tool.\n- [ ] Decide whether to use a real work problem or the shared case.\n\nBefore Week 4:\n\n- [ ] Confirm n8n access.\n- [ ] Import or recreate the shared workflow skeleton.\n- [ ] Confirm access to any APIs or mock tools used in the session.\n\nBefore Week 5:\n\n- [ ] Prepare at least 10 candidate eval rows.\n- [ ] Prepare one example trace or sample output from the prototype.\n\nBefore Week 8:\n\n- [ ] Assemble final portfolio packet.\n- [ ] Decide what can be public, private, or anonymized.\n- [ ] Prepare a 2-minute executive narrative.\n\n---\n\n## Tool Principles\n\n- Use tools to make product judgment visible.\n- Start with spreadsheets for evals before moving to tracing platforms.\n- Prefer simple workflows before agents.\n- Add autonomy only when it improves measurable outcomes.\n- Treat every tool action as a product permission decision.\n- Keep tool choices replaceable.\n"},{"file":"00_Advanced_Technical_Companion.md","title":"Advanced Technical Companion For Production AI PM","body":"# Advanced Technical Companion For Production AI PM\n\n## Purpose\n\nThis companion is for learners who want deeper technical credibility without turning the program into a coding bootcamp.\n\nThe goal is not to become the ML engineer. The goal is to lead AI product decisions with enough technical fluency to:\n\n- ask sharper engineering questions;\n- understand architecture tradeoffs;\n- define eval and telemetry requirements;\n- identify production risks early;\n- scope prototypes responsibly;\n- explain technical decisions to executives.\n\nUse this doc alongside the weekly workbooks. The core course remains no-code / low-code. This companion adds optional depth.\n\n---\n\n## The AI Product Stack\n\nUse this stack to reason about most GenAI, RAG, and agentic products.\n\n```text\nUser surface\n  -> workflow and task model\n  -> instruction layer\n  -> model selection\n  -> context and retrieval\n  -> tools and actions\n  -> memory and state\n  -> evals and observability\n  -> governance, safety, cost, and launch controls\n```\n\nAs a PM, your job is to connect each layer to a product decision.\n\n| Layer | PM decision |\n|---|---|\n| User surface | Where does AI appear, and what does the user control? |\n| Workflow | What job is being improved, removed, or delegated? |\n| Instruction layer | What behavior must the system follow? |\n| Model | What capability, latency, cost, and reliability do we need? |\n| Context/RAG | What information must the system use to be grounded? |\n| Tools/actions | What can the system do outside the chat box? |\n| Memory/state | What should persist, and what should not? |\n| Evals | How will we know it is good enough to ship? |\n| Observability | What traces, events, and metrics must be logged? |\n| Governance | What must be approved, blocked, reviewed, or rolled back? |\n\n---\n\n## Named Tools And Durable Principles\n\nThe course can demo named tools, but the principles should survive tool changes.\n\n| Need | Named tools to know | Tool-agnostic principle |\n|---|---|---|\n| Reasoning and drafting | Claude, ChatGPT | Use AI to expose options, assumptions, and critique |\n| Source-backed research | Perplexity, ChatGPT search, Gemini | Separate sourced facts from product interpretation |\n| Workflow automation | n8n, Make, Zapier | Model the workflow before adding autonomy |\n| UI prototyping | v0, Lovable, Bolt, Figma | Prototype the decision surface, not just screens |\n| Data tables and evals | Sheets, Airtable, Notion databases | Start evals in a visible table before scaling tooling |\n| API prototyping | OpenAI API, Anthropic API | Make system behavior explicit and measurable |\n| RAG and vectors | Supabase, Pinecone, Weaviate, Chroma | Retrieval quality matters more than vector-store branding |\n| Tracing and evals | LangSmith, Braintrust, Langfuse, Humanloop | Capture traces before arguing about quality |\n| Product analytics | PostHog, Amplitude, Mixpanel | Track workflow outcomes, not just feature clicks |\n| Engineering collaboration | GitHub, Linear, Jira, Slack | Convert product risk into explicit engineering work |\n\n---\n\n## Week-By-Week Technical Depth\n\n| Week | Optional technical depth | Output |\n|---|---|---|\n| 1 | Identify AI vs automation vs rules-based alternatives | AI opportunity filter with non-AI baseline |\n| 2 | Compare build, buy, partner, and wrapper approaches | Technical assumptions in strategy memo |\n| 3 | Map a GenAI system end to end | Plain-English system architecture |\n| 4 | Prototype a workflow with tool calls and approvals | Agent/RAG workflow and autonomy map |\n| 5 | Create eval rows, rubrics, and trace review criteria | Eval dataset and failure taxonomy |\n| 6 | Review architecture tradeoffs with engineering questions | Technical architecture brief |\n| 7 | Model cost, latency, security, and launch risk | Launch readiness review |\n| 8 | Translate technical tradeoffs into portfolio and interviews | AI PM technical narrative |\n\n---\n\n## Core Concepts PMs Must Understand\n\n### Tokens And Context\n\nTokens are the units models process. Context windows define how much text, data, instructions, and history the model can consider at once.\n\nPM implications:\n\n- long context can improve recall but increase cost and latency;\n- more context is not always better;\n- important instructions and evidence can get diluted;\n- retrieved context needs prioritization;\n- UX should not assume the model remembers everything.\n\nQuestions to ask:\n\n- What context is required for this task?\n- What context can be safely omitted?\n- What happens when the context is too large?\n- How do we handle stale, missing, or conflicting context?\n\n### Prompt And Instruction Layer\n\nThe instruction layer defines role, task, constraints, output format, refusal rules, and escalation behavior.\n\nPM implications:\n\n- prompts are product behavior, not copywriting;\n- prompts should map to acceptance criteria;\n- prompts should include failure behavior;\n- structured outputs are easier to evaluate than free-form text.\n\nQuestions to ask:\n\n- What must the system always do?\n- What must it never do?\n- When should it ask for clarification?\n- When should it refuse or escalate?\n- What output schema should engineering rely on?\n\n### Model Choice\n\nModel choice is a tradeoff between capability, reliability, latency, cost, privacy, availability, and ecosystem.\n\nPM implications:\n\n- the most capable model may be too slow or expensive;\n- cheaper models may be fine for narrow subtasks;\n- routing can send simple and complex tasks to different models;\n- fallback behavior matters in production.\n\nQuestions to ask:\n\n- What capability does the task actually require?\n- Which failure modes are unacceptable?\n- What latency does the user workflow tolerate?\n- What is the cost per successful workflow?\n- Do we need model fallback or routing?\n\n---\n\n## RAG And Knowledge Systems\n\nRAG means retrieval-augmented generation. The system retrieves relevant information and gives it to the model as context.\n\n### Basic RAG Flow\n\n```text\nUser asks or workflow triggers\n  -> query is created\n  -> relevant documents or records are retrieved\n  -> retrieved context is ranked or filtered\n  -> model generates an answer or action plan\n  -> output is evaluated, logged, and shown to the user\n```\n\n### PM Decisions In RAG\n\n| Decision | Why it matters |\n|---|---|\n| Source selection | Determines what the AI is allowed to know |\n| Chunking | Affects whether useful context is retrieved |\n| Metadata | Helps filter by customer, role, permission, recency, product, or region |\n| Ranking | Determines which evidence gets priority |\n| Citations | Makes trust and review easier |\n| Freshness | Prevents stale answers |\n| Permissions | Prevents data leakage |\n| Eval set | Shows whether retrieval works before launch |\n\n### RAG Failure Modes\n\n| Failure | What it looks like | Product response |\n|---|---|---|\n| Missing retrieval | The right source is never used | Improve indexing, query generation, or metadata |\n| Wrong retrieval | The system uses irrelevant context | Add filters, ranking, or source constraints |\n| Stale retrieval | The answer uses outdated information | Add freshness checks and source dates |\n| Permission leak | User sees content they should not see | Enforce access control before retrieval |\n| Overstuffed context | Model gets too much text and misses the point | Reduce context, rank better, summarize carefully |\n| Unsupported answer | Model answers beyond retrieved evidence | Require citations or refusal behavior |\n\n---\n\n## Agents And Workflow Automation\n\nUse \"agent\" carefully. Many useful AI products are workflows with AI steps, not fully autonomous agents.\n\n### Autonomy Tiers\n\n| Tier | AI role | Human role | Example |\n|---|---|---|---|\n| 0 | No AI | Does all work | Manual checklist |\n| 1 | Suggests | Reviews and acts | Drafts support reply |\n| 2 | Prepares | Approves before action | Creates refund recommendation |\n| 3 | Acts within limits | Reviews exceptions | Sends low-risk follow-up |\n| 4 | Plans and acts | Audits and intervenes | Multi-step account workflow |\n\nMost production products should start at Tier 1 or Tier 2.\n\n### Agent Design Checklist\n\n- What is the user goal?\n- What workflow step is being delegated?\n- What tools can the system use?\n- What data can it access?\n- What actions require approval?\n- What stop conditions prevent loops?\n- What recovery path exists after failure?\n- What traces are saved?\n- What evals must pass before launch?\n\n### Tool-Calling Product Decisions\n\nEvery tool call is a permission decision.\n\nFor each tool/action, define:\n\n- name;\n- purpose;\n- required input;\n- allowed user roles;\n- data access rules;\n- approval requirement;\n- rate limit or budget limit;\n- failure behavior;\n- logging requirement.\n\n---\n\n## Evals And Observability\n\nIn AI products, evals are part of the product spec.\n\n### Eval Types\n\n| Eval type | Use it for | Example |\n|---|---|---|\n| Golden dataset | Known test cases before launch | 20 customer questions with expected behavior |\n| Rubric eval | Human or LLM-assisted quality review | Groundedness, task completion, safety |\n| Regression eval | Prevent old bugs from returning | Previously failed traces must now pass |\n| Red-team eval | Stress risky behavior | Prompt injection, bad context, unsafe action |\n| Online monitoring | Measure real-world performance | Escalation rate, correction rate, latency |\n| Human review | Align quality with expert judgment | Reviewer approves or rejects outputs |\n\n### Trace Review\n\nA trace is a record of what happened inside the AI workflow.\n\nUseful traces include:\n\n- user input;\n- system instructions;\n- retrieved context;\n- tool calls;\n- intermediate decisions;\n- final output;\n- human edits;\n- latency;\n- cost;\n- error or refusal state.\n\nPM questions:\n\n- Which traces should be reviewable?\n- Who reviews them?\n- What failures block launch?\n- Which issues become product work vs model work?\n- How will we know quality improved?\n\n---\n\n## Cost And Latency\n\nAI product economics are shaped by usage, context, model calls, tool calls, retries, evals, and human review.\n\n### Cost Drivers\n\n| Driver | PM implication |\n|---|---|\n| Number of model calls | Multi-step workflows can multiply cost quickly |\n| Context size | Long prompts and retrieved docs increase cost |\n| Output size | Long generated content costs more and takes longer |\n| Model choice | Premium models may be needed only for hard tasks |\n| Tool/API calls | External calls add cost and latency |\n| Retries | Poor quality can create hidden cost |\n| Human review | Review effort is part of cost per successful workflow |\n\n### Optimization Levers\n\n- route simple tasks to cheaper models;\n- cache repeated context;\n- summarize or compress long context;\n- use retrieval filters;\n- batch background tasks;\n- reduce unnecessary tool calls;\n- split synchronous and asynchronous work;\n- require human approval only where risk warrants it.\n\nPM questions:\n\n- What is the cost per successful workflow?\n- What latency does the user actually tolerate?\n- Which steps can happen in the background?\n- Which quality failures create rework cost?\n- What usage level breaks the business case?\n\n---\n\n## Safety, Security, And Governance\n\nAI risk is product risk. It should be handled in the PRD, architecture brief, eval plan, and launch review.\n\n### Common Risk Areas\n\n| Risk | Example | Control |\n|---|---|---|\n| Prompt injection | User tricks AI into ignoring rules | Instruction hierarchy, input filtering, tool limits |\n| Data leakage | AI exposes private data | Access control, retrieval permissions, logging |\n| Hallucination | AI makes unsupported claims | Grounding, citations, refusal rules, evals |\n| Excessive agency | AI takes action without approval | Autonomy tiers, human gates, tool limits |\n| Unsafe recommendation | AI suggests harmful action | Safety rubric, escalation rules, red-team tests |\n| High-cost loops | Agent repeats tool calls | Budget limits, stop conditions, monitoring |\n| Audit gap | Team cannot explain what happened | Trace logging and review process |\n\n### Launch Gate Examples\n\nDo not launch if:\n\n- critical eval rows fail;\n- sensitive data can leak across users or accounts;\n- risky actions lack approval gates;\n- rollback is undefined;\n- trace review is unavailable;\n- cost per workflow breaks the business case;\n- latency makes the workflow unusable.\n\n---\n\n## Architecture Brief Template\n\nUse this as the technical appendix to your AI PRD.\n\n### 1. Product Context\n\n- User:\n- Workflow:\n- AI role:\n- Human role:\n- Business outcome:\n\n### 2. System Map\n\n- User surface:\n- Input:\n- Instruction layer:\n- Model:\n- Retrieval/context:\n- Tools/actions:\n- Memory/state:\n- Output:\n- Human approval:\n- Telemetry:\n\n### 3. Data And Context\n\n| Source | Purpose | Freshness | Permission rule | Failure if missing |\n|---|---|---|---|---|\n| | | | | |\n\n### 4. Tool/Action Registry\n\n| Tool/action | What it does | Approval? | Failure behavior | Logged? |\n|---|---|---|---|---|\n| | | | | |\n\n### 5. Eval Contract\n\n- Golden dataset size:\n- Critical failure rows:\n- Rubric criteria:\n- Required pass threshold:\n- Human review process:\n- Release-blocking failures:\n\n### 6. Production Constraints\n\n- Latency target:\n- Cost target:\n- Privacy requirement:\n- Security requirement:\n- Rollback trigger:\n- Monitoring owner:\n\n### 7. Engineering Questions\n\n1. What context is required for reliable output?\n2. Which actions require approval?\n3. What should be logged for trace review?\n4. What is the fallback when the model or retrieval fails?\n5. Which eval failures block beta?\n\n---\n\n## Recommended Advanced Tool Path\n\nUse this if you want deeper technical proof in your portfolio.\n\n### Path A: Low-Code Technical Portfolio\n\nBest for PMs who want technical credibility without code.\n\nUse:\n\n- n8n or Make for workflow orchestration;\n- Google Sheets or Airtable for eval data;\n- Claude or ChatGPT for structured outputs;\n- Figma or FigJam for system maps;\n- PostHog or a spreadsheet for basic telemetry model.\n\nBuild:\n\n- one workflow with at least 4 steps;\n- one human approval gate;\n- one tool/action step;\n- one eval table with 20 rows;\n- one launch review with cost/latency assumptions.\n\n### Path B: API-Literate Portfolio\n\nBest for PMs comfortable reading API docs and working with engineering.\n\nUse:\n\n- OpenAI or Anthropic API;\n- a lightweight prototype environment;\n- LangSmith, Braintrust, Langfuse, or Humanloop for traces/evals;\n- Supabase, Pinecone, Weaviate, Chroma, or a managed RAG tool;\n- GitHub for private artifacts.\n\nBuild:\n\n- one API-based prompt or workflow spec;\n- one small RAG or tool-calling prototype;\n- one trace review;\n- one eval run;\n- one architecture brief with unresolved engineering questions.\n\n### Path C: Engineering-Team Companion\n\nBest for PMs working inside an existing AI/ML team.\n\nUse:\n\n- your team's approved stack;\n- internal telemetry and eval tools;\n- approved synthetic or anonymized data;\n- existing PRD, ticketing, and review workflows.\n\nBuild:\n\n- an AI PRD aligned to team architecture;\n- an eval contract engineering can implement;\n- a launch-readiness checklist;\n- stakeholder-facing tradeoff memo.\n\n---\n\n## PM Questions For Engineering Reviews\n\nUse these in Week 6 and Week 7.\n\n### Capability\n\n- What can the model reliably do today?\n- What does it do well only in demos?\n- What examples show the boundary of capability?\n\n### Context\n\n- What data must be available at inference time?\n- What happens when data is stale, missing, or contradictory?\n- How are permissions enforced before retrieval?\n\n### Workflow\n\n- Which steps are deterministic and which are probabilistic?\n- Which actions require human approval?\n- What is the recovery path after a failed action?\n\n### Evals\n\n- What test set represents real user risk?\n- Which eval failures block launch?\n- How will regressions be caught?\n\n### Cost And Latency\n\n- What are the biggest cost drivers?\n- Which parts must be real-time?\n- Which parts can run in the background?\n\n### Safety And Operations\n\n- What is logged?\n- Who reviews traces?\n- What is the rollback plan?\n- What incident would make us pause launch?\n\n---\n\n## Portfolio Signals For Global AI PM Roles\n\nYour technical work should signal leadership, not tool tourism.\n\nStrong signals:\n\n- clear AI PRD with acceptance criteria;\n- system map with context, tools, approvals, and telemetry;\n- eval dataset tied to real workflow risk;\n- red-team cases and launch-blocking failures;\n- cost and latency reasoning;\n- tradeoff memo on model, RAG, autonomy, or build/buy/partner;\n- concise interview story explaining technical choices in product language.\n\nWeak signals:\n\n- screenshots of chat outputs only;\n- prompt library without product context;\n- generic chatbot demo;\n- architecture diagram with no eval or launch plan;\n- tool list without tradeoffs;\n- public portfolio that exposes confidential data.\n\n---\n\n## Glossary\n\n| Term | Meaning for PMs |\n|---|---|\n| Agent | A system that can plan, use tools, and act within boundaries |\n| Context window | The amount of information a model can consider at once |\n| Embedding | Numeric representation used to compare semantic similarity |\n| Eval | A repeatable way to judge AI quality |\n| Golden dataset | Curated examples used to test expected behavior |\n| Grounding | Tying AI output to approved context or evidence |\n| Hallucination | Unsupported or false output presented confidently |\n| Human-in-the-loop | Human review or approval inside the workflow |\n| Latency | Time the user waits for the system |\n| Memory | Information persisted across turns or sessions |\n| RAG | Retrieval-augmented generation; retrieving context before generation |\n| Trace | A record of model inputs, context, tool calls, outputs, and outcomes |\n| Tool call | A model-triggered action against an API, database, or workflow step |\n| Vector database | A system that stores embeddings for semantic retrieval |\n\n---\n\n## Final Technical Bar\n\nBy the end of the program, an advanced learner should be able to explain:\n\n- what AI system they would build;\n- what context it needs;\n- where autonomy is allowed and where approval is required;\n- how quality is evaluated;\n- what traces are logged;\n- what cost and latency constraints matter;\n- what launch risks must be controlled;\n- what engineering questions remain unresolved.\n\nThat is enough technical depth for a senior AI PM portfolio without pretending to be the ML engineer.\n"},{"file":"00_Assessment_Rubrics_And_Certification.md","title":"Assessment Rubrics And Certification","body":"# Assessment Rubrics And Certification\n\n## Purpose\n\nThis document defines how learner work is reviewed, what counts as completion, and what standard earns a certificate.\n\nThe course is not graded like an academic program. It is assessed like senior product work: clear decisions, defensible tradeoffs, and production judgment.\n\n---\n\n## Completion Levels\n\n| Level | Meaning |\n|---|---|\n| Incomplete | Artifact missing or too generic to review |\n| Developing | Direction is visible, but assumptions and quality bar are weak |\n| Cohort Ready | Strong enough for cohort completion |\n| Portfolio Ready | Strong enough to show in interviews or executive conversations |\n| Showcase Ready | Strong enough for public or semi-public portfolio use after privacy review |\n\nThe default target is Portfolio Ready for the final packet.\n\n---\n\n## Certificate Criteria\n\nTo receive a certificate of completion, a learner must:\n\n- attend at least 6 of 8 live sessions or review recordings and submit make-up work;\n- submit at least 5 of 7 portfolio artifacts;\n- submit the final portfolio packet;\n- complete the eval dataset with at least 20 rows;\n- complete the launch readiness review;\n- deliver or submit the 2-minute executive narrative;\n- follow confidentiality and AI use policies.\n\nTo receive a distinction or top-performer note, a learner must:\n\n- submit all 7 artifacts;\n- reach Portfolio Ready on at least 5 artifacts;\n- show clear technical tradeoff reasoning;\n- include evals and production readiness in the final narrative;\n- provide useful critique to peers.\n\n---\n\n## Master Rubric\n\n| Dimension | Developing | Cohort Ready | Portfolio Ready |\n|---|---|---|---|\n| Product judgment | Problem and user are broad | User, workflow, and pain are specific | Clear pursue, reshape, or kill logic |\n| AI necessity | AI is assumed useful | Non-AI alternative is named | AI role is justified by workflow, context, and value |\n| Strategy | Business value is vague | Outcome and first release are defined | Moat, distribution, and build/buy/partner logic are credible |\n| System design | Tool choice dominates | System behavior is mapped | Context, tools, approvals, telemetry, and failure modes are clear |\n| Evals | Quality is subjective | Rubric and sample rows exist | Golden dataset catches launch-blocking failures |\n| Production readiness | Risks are listed | Cost, latency, safety, and rollback are addressed | Launch gates are measurable and defensible |\n| Communication | Artifact is hard to scan | Artifact is clear and concise | Executive and interview narratives are strong |\n\n---\n\n## Artifact Rubrics\n\n### 1. AI Product Strategy Memo\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| User and workflow | Specific user, workflow, trigger, and current pain |\n| AI rationale | Explains why AI is needed and why simpler alternatives are insufficient |\n| Business case | Names business outcome and leading indicators |\n| Defensibility | Explains data, workflow, distribution, or learning-loop advantage |\n| First release | Defines what should ship first and what should not |\n| Kill criteria | Names evidence that would stop or reshape the idea |\n\n### 2. AI PRD\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| User journey | Trigger, user goal, AI role, human role, success, and failure states |\n| System behavior | Inputs, context, output, retrieval, tools, and approval points |\n| Failure modes | Meaningful failures with impact, detection, and mitigation |\n| Acceptance criteria | Must-do, must-not-do, escalation, refusal, and logging rules |\n| Engineering clarity | Clear enough for an engineering review without heavy translation |\n\n### 3. Agent/RAG Workflow Prototype\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| Workflow | At least 4 meaningful steps connected to user value |\n| Context | Names data sources, permissions, and freshness needs |\n| Autonomy | Approval gates and stop conditions are explicit |\n| Demo | Demonstrates the target workflow, not just a generic chat interaction |\n| Recovery | Includes failure and recovery path |\n\n### 4. Eval Dataset And Rubric\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| Golden dataset | At least 20 rows, including edge cases and failure cases |\n| Expected behavior | Specific enough to judge pass/fail |\n| Failure taxonomy | Covers groundedness, wrong context, unsafe action, escalation, and UX/trust |\n| Severity | Launch-blocking rows are marked |\n| Rubric | Criteria can be used repeatedly by human or automated reviewers |\n\n### 5. Technical Architecture Brief\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| System map | Clear plain-English architecture |\n| Model/context/tools | Names the major components and tradeoffs |\n| Telemetry | Explains what needs to be logged and reviewed |\n| Engineering questions | Lists unresolved questions that matter before launch |\n| PM judgment | Connects technical choices to product risk and user outcomes |\n\n### 6. Production Readiness Review\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| Cost model | Includes usage, model calls, context, tool calls, and review effort |\n| Latency | Defines user-facing or background latency targets |\n| Risk register | Includes likelihood, impact, mitigation, and launch gates |\n| Safety/security | Covers prompt injection, data leakage, excessive agency, and escalation |\n| Launch plan | Defines alpha, beta, GA criteria, rollback, and monitoring |\n\n### 7. Executive Narrative And Interview Story\n\n| Criterion | Portfolio Ready bar |\n|---|---|\n| Executive story | Clear 2-minute explanation of business problem, AI choice, system, evals, and risk |\n| Interview story | Shows product judgment, technical tradeoff, and cross-functional leadership |\n| Evidence | Points to portfolio artifacts without overwhelming the listener |\n| Seniority signal | Communicates decisions and tradeoffs, not just participation |\n\n---\n\n## Feedback Template\n\nUse this for written reviews.\n\n```text\nArtifact:\nCurrent level:\nStrongest signal:\nWeakest assumption:\nProduction risk:\nTechnical clarity:\nPortfolio improvement:\nNext action:\n```\n\n---\n\n## Final Review Scorecard\n\n| Item | Status |\n|---|---|\n| Strategy Memo submitted | |\n| AI PRD submitted | |\n| Workflow Prototype submitted | |\n| Eval Dataset and Rubric submitted | |\n| Technical Architecture Brief submitted | |\n| Production Readiness Review submitted | |\n| Executive Narrative submitted | |\n| Confidentiality reviewed | |\n| Public/private/anonymized labels added | |\n| Certificate criteria met | |\n\n---\n\n## Certificate Language\n\nSuggested certificate wording:\n\n```text\nThis certifies that [Learner Name] completed Production AI PM, an 8-week applied cohort focused on leading GenAI and agentic products from strategy to launch.\n\nThe learner completed applied work across AI product strategy, system design, agent/RAG workflows, evals, technical architecture, production readiness, and executive communication.\n```\n\nKeep the certificate honest. The stronger proof is the portfolio packet.\n"},{"file":"00_Capstone_Casebook.md","title":"Capstone And Casebook","body":"# Capstone And Casebook\n\n## Purpose\n\nThe capstone is the spine of Production AI PM. Every learner should leave with a portfolio packet that shows how they would lead one AI product from opportunity selection through launch readiness.\n\nThis casebook gives learners and instructors a shared structure.\n\n---\n\n## Capstone Rules\n\nEvery capstone must have:\n\n- a specific user;\n- a real workflow or decision;\n- a clear pain;\n- a non-AI alternative;\n- data or context requirements;\n- failure modes;\n- evals;\n- cost and latency assumptions;\n- launch gates.\n\nAvoid capstones that are:\n\n- generic chatbots;\n- tool demos without a user workflow;\n- \"AI for everything\" ideas;\n- ideas that require sensitive data the learner cannot safely discuss;\n- ideas where failure has no meaningful consequence.\n\n---\n\n## Capstone Tracks\n\n| Track | Best for | Example directions |\n|---|---|---|\n| Enterprise Copilot | B2B SaaS, internal tools, customer-facing expert workflows | Success copilot, sales account prep, support response assistant |\n| Agentic Workflow Product | Operations, routing, approvals, multi-step automation | Renewal risk workflow, research agent, claims triage |\n| Decision Support Product | Recommendations, summarization, ranking, trust | Travel planner, card recommendation, health content assistant |\n\n---\n\n## Shared Teaching Case\n\nUse this case throughout live teaching.\n\n### Customer Success Copilot For B2B SaaS\n\nTarget user:\n\n- Customer Success Manager managing mid-market and enterprise accounts.\n\nWorkflow:\n\n- Prepare for renewal or risk review.\n- Understand account health.\n- Identify risks and opportunities.\n- Draft next-best actions.\n- Escalate risky accounts.\n\nCurrent pain:\n\n- information is scattered across CRM, support tickets, product usage, call notes, and email;\n- CSMs spend too much time preparing and still miss important context;\n- risk signals are inconsistent;\n- recommendations vary by CSM quality and time available.\n\nWhy AI may help:\n\n- synthesize scattered context;\n- summarize account history;\n- highlight risks and evidence;\n- suggest playbooks;\n- draft internal and customer-facing next steps;\n- route high-risk cases for review.\n\nNon-AI alternative:\n\n- dashboard with health score;\n- checklist-driven account review;\n- manual CSM prep template;\n- rules-based risk alerts.\n\nPotential product outcome:\n\n- reduce prep time;\n- improve risk detection;\n- increase renewal quality;\n- improve consistency of CSM recommendations.\n\n---\n\n## Shared Case System Map\n\n```text\nCSM opens account review\n  -> system retrieves account context\n  -> AI summarizes evidence and risks\n  -> AI recommends playbook and next action\n  -> CSM reviews and edits\n  -> approved action is logged\n  -> risky accounts are escalated\n  -> traces and outcomes feed evals\n```\n\n---\n\n## Shared Case Data Sources\n\n| Source | Example fields | Risk |\n|---|---|---|\n| CRM | plan, renewal date, account owner, contract value | stale or incomplete fields |\n| Product usage | logins, feature adoption, seat utilization | misleading usage patterns |\n| Support tickets | issue severity, sentiment, open bugs | wrong account or outdated ticket |\n| Call notes | objections, stakeholders, commitments | unstructured and subjective |\n| Email summaries | follow-ups, commitments, blockers | privacy and permission boundaries |\n| Playbook library | recommended actions by scenario | outdated playbooks |\n\n---\n\n## Shared Case Failure Modes\n\n| Failure | Example | Launch implication |\n|---|---|---|\n| Unsupported claim | Says account is at risk without evidence | Require citations and evidence |\n| Wrong account context | Mixes data from another customer | Block launch until permissions and retrieval pass |\n| Bad recommendation | Suggests discount when issue is product adoption | Improve rubric and playbook mapping |\n| Unsafe action | Sends customer email without review | Require approval gate |\n| Missing escalation | Fails to flag high-risk renewal | Mark as launch-blocking eval row |\n| High-cost workflow | Calls model repeatedly for every account view | Add caching, routing, and usage limits |\n\n---\n\n## Public Example Contexts\n\nThese examples can be used for teaching and content.\n\n### Wasabi Travels\n\nPotential product angle:\n\n- AI-assisted travel planning and itinerary refinement.\n\nAI PM lessons:\n\n- uncertainty handling;\n- preference capture;\n- recommendation quality;\n- trust and user control;\n- cost of repeated planning loops.\n\nPossible capstone:\n\n- \"AI trip planning copilot for high-intent travelers who need itinerary confidence before booking.\"\n\n### Card Compass\n\nPotential product angle:\n\n- decision support and recommendation quality for financial products.\n\nAI PM lessons:\n\n- explainability;\n- ranking quality;\n- trust;\n- suitability;\n- evals for recommendation accuracy and user outcomes.\n\nPossible capstone:\n\n- \"AI card recommendation assistant that explains tradeoffs and avoids unsupported financial claims.\"\n\n### Valik Diary\n\nPotential product angle:\n\n- memory, reflection, personalization, and knowledge workflows.\n\nAI PM lessons:\n\n- long-term memory;\n- privacy boundaries;\n- personalization quality;\n- tone and user trust;\n- retrieval and summarization.\n\nPossible capstone:\n\n- \"AI reflection companion that turns user entries into safe, private, and useful personal insights.\"\n\n---\n\n## Capstone Selection Worksheet\n\nUse this in Week 1.\n\n| Question | Answer |\n|---|---|\n| Who is the user? | |\n| What workflow or decision is being improved? | |\n| How often does this happen? | |\n| What is painful, expensive, slow, risky, or inconsistent today? | |\n| What is the best non-AI alternative? | |\n| What data or context is available? | |\n| What could go wrong? | |\n| What would make this idea worth killing? | |\n| Which capstone track fits best? | |\n\n---\n\n## Capstone Review Gates\n\n| Week | Gate | Pass condition |\n|---|---|---|\n| 1 | Opportunity | User, workflow, pain, non-AI alternative, and risk are clear |\n| 2 | Strategy | Business outcome, moat, and first release are defensible |\n| 3 | System | AI behavior, context, tools, and approvals are mapped |\n| 4 | Workflow | Prototype shows workflow and autonomy boundaries |\n| 5 | Evals | Golden dataset and rubric catch meaningful failures |\n| 6 | Architecture | Engineering questions and tradeoffs are visible |\n| 7 | Launch | Cost, latency, risk, monitoring, and rollback are defined |\n| 8 | Story | Portfolio and interview narrative show senior judgment |\n\n---\n\n## Fallback Capstone Prompts\n\nUse these when learners cannot use work context.\n\n1. Customer Success Copilot for B2B SaaS renewal risk.\n2. AI Travel Planner for high-intent international travelers.\n3. Credit Card Recommendation Assistant for informed decision support.\n4. Internal Research Agent for a strategy team.\n5. Support Triage Assistant for high-volume tickets.\n6. Sales Account Prep Copilot for enterprise reps.\n7. Hiring Screening Workflow with strict human review.\n8. Compliance Policy Assistant with citations and refusal rules.\n\nLearners should choose one and adapt it into a specific user/workflow pair.\n"},{"file":"00_Prompt_And_Workflow_Library.md","title":"Prompt And Workflow Library","body":"# Prompt And Workflow Library\n\n## Purpose\n\nThis library gives learners reusable prompts and workflow patterns for the course.\n\nThe prompts are not the product. They are thinking scaffolds. Learners should adapt them to their capstone, user, workflow, and data context.\n\n---\n\n## How To Use These Prompts\n\nFor every prompt:\n\n1. Replace bracketed fields.\n2. Add your capstone context.\n3. Ask for assumptions and risks.\n4. Review the output critically.\n5. Convert the answer into your own product artifact.\n\nDo not paste private customer or company data into tools unless approved.\n\n---\n\n## Week 1: AI Opportunity Filter Prompt\n\n```text\nAct as a senior AI product advisor.\n\nI am evaluating this AI product idea:\n[describe idea]\n\nTarget user:\n[user]\n\nWorkflow:\n[workflow]\n\nScore the idea from 1 to 5 on:\n1. Pain\n2. Workflow leverage\n3. Available context/data\n4. Quality tolerance\n5. Economics\n6. Risk controllability\n\nFor each score, explain:\n- why you gave that score;\n- what assumption is weakest;\n- what evidence would make us kill or reshape the idea.\n\nEnd with a pursue / reshape / kill recommendation.\n```\n\n---\n\n## Week 2: Strategy Memo Critique Prompt\n\n```text\nAct as a critical senior AI PM reviewer.\n\nReview this AI product strategy memo:\n[paste memo or summary]\n\nEvaluate it for:\n- user and workflow specificity;\n- AI necessity vs non-AI alternative;\n- business outcome;\n- data or workflow advantage;\n- build / buy / partner logic;\n- first release scope;\n- kill criteria.\n\nReturn:\n1. strongest strate
