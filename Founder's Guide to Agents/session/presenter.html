<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Founder's Guide to Agents — Saturday Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#09111b;--panel:#101d2b;--panel2:#14263a;--paper:#f5f1e9;--muted:#aebdca;--blue:#5eb4ff;--mint:#8ff0c8;--orange:#ff9c66;--line:rgba(215,231,244,.2)}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 Manrope,sans-serif}button{font:inherit}.deck{height:100%;overflow:hidden}.slide{height:100%;display:none;position:relative;padding:clamp(24px,5vw,76px);background:radial-gradient(circle at 82% 17%,#17385a 0,transparent 30%),var(--ink)}.slide.active{display:flex;flex-direction:column;animation:appear .42s ease}.top{display:flex;justify-content:space-between;align-items:center;font:500 11px DM Mono,monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:13px}.slide-body{width:min(1240px,100%);margin:auto;position:relative;z-index:1}.kicker{color:var(--mint);font:500 12px DM Mono,monospace;letter-spacing:.14em;text-transform:uppercase}.title{font:400 clamp(3.4rem,8vw,8.8rem)/.94 Fraunces,serif;letter-spacing:-.055em;margin:18px 0;max-width:11ch}.title.medium{font-size:clamp(3rem,6vw,6.8rem);max-width:13ch}.lede{font:400 clamp(1.1rem,1.7vw,1.5rem)/1.45 Fraunces,serif;color:#d4dce2;max-width:48ch}.stat{font:400 clamp(6rem,15vw,13rem)/.8 Fraunces,serif;color:var(--blue);letter-spacing:-.08em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}.card{border:1px solid var(--line);padding:23px;background:rgba(20,38,58,.76);min-height:152px}.card b{display:block;font:500 12px DM Mono,monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--mint);margin-bottom:10px}.card p{margin:0;color:#d1dae1}.diagram{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:36px;max-width:1080px}.node{padding:20px;border:1px solid var(--line);background:var(--panel);min-height:120px}.node:not(:last-child)::after{content:'→';float:right;transform:translateX(28px);color:var(--orange);font-size:28px}.node b{display:block;color:var(--blue);font:500 11px DM Mono,monospace;letter-spacing:.1em}.node p{margin:10px 0 0}.matrix{display:grid;grid-template-columns:150px 1fr 1fr;max-width:920px;margin-top:34px;border-top:1px solid var(--line);border-left:1px solid var(--line)}.matrix>*{padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.matrix strong{color:var(--mint)}.quote{font:400 clamp(2.7rem,5.5vw,6.2rem)/.98 Fraunces,serif;max-width:15ch;letter-spacing:-.045em}.number{position:absolute;right:5vw;bottom:2vh;font:400 clamp(5rem,12vw,12rem)/1 Fraunces,serif;color:rgba(255,255,255,.09)}.footer{position:absolute;bottom:clamp(18px,3vw,40px);left:clamp(24px,5vw,76px);right:clamp(24px,5vw,76px);display:flex;justify-content:space-between;align-items:center}.nav{display:flex;gap:8px}.nav button{border:1px solid var(--line);background:transparent;color:var(--paper);padding:9px 12px;cursor:pointer}.nav button:hover{background:var(--paper);color:var(--ink)}.progress{width:170px;height:4px;background:var(--line)}.progress i{display:block;height:100%;background:var(--mint);transition:width .2s ease}.safety{color:var(--orange);font:500 12px DM Mono,monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:30px}.prompt{font:500 clamp(1.1rem,1.7vw,1.55rem)/1.5 DM Mono,monospace;background:var(--panel);padding:24px;border-left:4px solid var(--blue);max-width:920px;margin-top:30px;color:#e9f1f7}.callout{background:var(--mint);color:var(--ink);padding:24px;max-width:800px;margin-top:30px;font-size:1.15rem}.callout b{font-family:Fraunces,serif;font-size:1.5rem}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:700px){.grid,.diagram{grid-template-columns:1fr}.node:not(:last-child)::after{content:'↓';float:none;display:block;transform:translateY(22px)}.matrix{grid-template-columns:100px 1fr 1fr}.matrix>*{padding:11px}.top{font-size:9px}.footer{gap:12px}.progress{width:100px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body><main class="deck" id="deck"></main>
<script>
const slides=[
{tag:'Saturday / 10:00–14:00',title:'Build agents that earn their keep.',body:'Two working agents for founder operations—not your product. Leave with a pattern you can reuse.',kind:'hero'},
{tag:'The frame',title:'Find the work around the work.',body:'Sales, hiring, investor relations, marketing, feedback, finance: the recurring operations task is the raw material.',kind:'cards',cards:[['Sales & BD','Research, outreach, follow-up'],['Investor relations','Updates, fit research, relationship memory'],['Product & feedback','Triage, themes, review monitoring']]},
{tag:'The decision',title:'Agent, prompt, tool—or human?',body:'Frequency and judgement tell you which move is sensible.',kind:'matrix'},
{tag:'The test',title:'Agent or prompt?',body:'A useful prompt is not automatically an agent.',kind:'diagram'},
{tag:'Build 01',title:'Weekly Repo/Product Digest',body:'Turn a week of commits into a plain-English update a co-founder or investor can understand.',kind:'digest'},
{tag:'The pause',title:'A summary is not the action.',body:'Make it real with a trigger and a delivery channel.',kind:'quote'},
{tag:'Build 02',title:'Investor Qualification + Outreach',body:'Use a round description to research fit, score matches, and create draft outreach for your review.',kind:'investor'},
{tag:'Safety',title:'Human review before action.',body:'A Gmail draft is not a sent email. You decide what leaves the building.',kind:'safety'},
{tag:'Generalise',title:'Your next agent.',body:'Name the task. Then draw its trigger, live data, reasoning, and action.',kind:'generalise'},
{tag:'Close',title:'Keep one agent alive next week.',body:'Run it on real work. Notice what breaks. Fix it—or point the pattern at the next bottleneck.',kind:'hero'}];
const deck=document.querySelector('#deck');let current=0;
function interior(s){if(s.kind==='cards')return `<div class="grid">${s.cards.map(c=>`<div class="card"><b>${c[0]}</b><p>${c[1]}</p></div>`).join('')}</div>`;if(s.kind==='matrix')return `<div class="matrix"><div></div><strong>Low judgement</strong><strong>High judgement</strong><strong>Occasional</strong><div>Buy a tool</div><div>Hire or consult</div><strong>Frequent</strong><div><strong>Build an agent</strong></div><div>Augment yourself</div></div>`;if(s.kind==='diagram')return `<div class="diagram"><div class="node"><b>01 / Trigger</b><p>Schedule, webhook, event</p></div><div class="node"><b>02 / Live data</b><p>Repo, inbox, web, database</p></div><div class="node"><b>03 / Reasoning</b><p>Summarise, score, draft</p></div><div class="node"><b>04 / Action</b><p>Write, update, draft, notify</p></div></div>`;if(s.kind==='digest')return `<div class="prompt">Look at the last 7 days of commits on &lt;owner/repo&gt;. Explain what shipped in 3–5 sentences, in plain English. No git jargon.</div><p class="safety">Live data → reasoning → delivery</p>`;if(s.kind==='quote')return `<div class="quote">“If it waits for you to ask every time, it is still a prompt.”</div>`;if(s.kind==='investor')return `<div class="diagram"><div class="node"><b>Round</b><p>Stage, sector, geography, check size</p></div><div class="node"><b>Research</b><p>Live web search or fallback list</p></div><div class="node"><b>Fit score</b><p>Stage, sector, geography, check size</p></div><div class="node"><b>Draft</b><p>Personalised Gmail draft, never send</p></div></div>`;if(s.kind==='safety')return `<div class="callout"><b>Automation is not abdication.</b><br>Use the agent to prepare the work; reserve the consequential decision for the founder.</div>`;if(s.kind==='generalise')return `<div class="diagram"><div class="node"><b>Trigger</b><p>What starts it?</p></div><div class="node"><b>Live data</b><p>What does it pull?</p></div><div class="node"><b>Reasoning</b><p>What does it work out?</p></div><div class="node"><b>Action</b><p>What changes elsewhere?</p></div></div>`;return ''}
function render(){const s=slides[current];deck.innerHTML=`<section class="slide active"><header class="top"><span>Founder's Guide to Agents</span><span>${s.tag}</span></header><div class="slide-body"><p class="kicker">${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</p><h1 class="title ${s.kind==='hero'?'':'medium'}">${s.title}</h1><p class="lede">${s.body}</p>${interior(s)}</div><div class="number">${String(current+1).padStart(2,'0')}</div><footer class="footer"><div class="progress"><i style="width:${(current+1)/slides.length*100}%"></i></div><div class="nav"><button aria-label="Previous slide" onclick="change(-1)">←</button><button aria-label="Next slide" onclick="change(1)">→</button></div></footer></section>`}function change(n){current=Math.max(0,Math.min(slides.length-1,current+n));render()}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();change(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();change(-1)}});render();
</script></body></html>
